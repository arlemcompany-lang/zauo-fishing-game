<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ざうお目黒店 なつやすみつりゲーム</title>
<style>
  :root{
    --sea:#1e6fa8; --sea-deep:#0f4c75; --sand:#f4e2c8; --wood:#8b5a2b;
    --accent:#ff9f43; --white:#ffffff;
    --langbar-h:44px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{height:100%; margin:0; overflow:hidden; overscroll-behavior:none;}
  body{
    font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Segoe UI",sans-serif;
    background:linear-gradient(180deg,#bfe6ff 0%,#8fd0f0 40%,var(--sea) 100%);
    display:flex; align-items:center; justify-content:center;
    height:100vh; width:100vw; touch-action:none;
  }
  /* スマホのアドレスバー分だけ100vhが実際の表示領域より大きくなり、
     下端(ボタン等)が見えなくなる問題への対策。対応ブラウザではdvhで実際の表示高さに合わせる */
  @supports (height: 100dvh){
    body{ height:100dvh; }
  }
  #app{
    position:relative; width:100%; max-width:480px; height:100%;
    max-height:900px; margin:0 auto; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .screen{
    position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; padding:env(safe-area-inset-top,16px) 16px env(safe-area-inset-bottom,16px);
    overflow-y:auto;
  }
  .screen.active{display:flex;}

  h1.title{
    color:#fff; text-shadow:0 2px 4px rgba(0,0,0,.3);
    font-size:22px; text-align:center; margin:12px 0 20px;
  }

  /* ---- 国旗 ---- */
  /* 言語選択画面(.lang-grid / 大きい .lang-btn)は廃止し、上部の #langBar に置き換えた */
  .flag-canvas{display:block; border-radius:4px;}

  /* ---- 共通ボタン ---- */
  .big-btn{
    background:var(--accent); color:#fff; border:none; border-radius:26px;
    padding:16px 40px; font-size:19px; font-weight:bold;
    box-shadow:0 4px 0 #c9761f; margin:8px;
  }
  .big-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #c9761f;}
  .ghost-btn{
    background:rgba(255,255,255,.85); color:#555; border:none; border-radius:20px;
    padding:10px 24px; font-size:15px; font-weight:bold; margin:6px;
  }
  .nav-row{display:flex; justify-content:center; align-items:center; margin-top:auto; padding-top:14px; flex-wrap:wrap;}

  /* ---- キャラメイク ---- */
  .char-preview-wrap{
    background:radial-gradient(circle at center, #eaf6ff 0%, #d3ecff 70%, transparent 100%);
    border-radius:20px; padding:8px; margin-top:6px;
  }
  #charCanvas{display:block;}
  /* 画面が短い端末(iPhone SE等)ではプレビューを小さくし、
     選択肢がなるべく多く画面に見えるようにする */
  @media (max-height:720px){
    #charCanvas{width:148px; height:181px;}
    .char-preview-wrap{padding:4px; margin-top:2px;}
  }
  /* 選択肢ブロックが多く画面に収まらないため、画面全体をスクロールさせると
     「つぎへ」ボタンが画面外に隠れる。選択肢部分だけをスクロール領域にして
     タイトル・キャラプレビュー・つぎへボタンは常に見えるようにする */
  #screen-char{overflow:hidden;}
  #screen-char > h1.title,
  #screen-char > .char-preview-wrap,
  #screen-char > .nav-row{flex:0 0 auto;}
  #screen-char > #charOptions{
    flex:1 1 auto; min-height:0; overflow-y:auto;
    width:100%; display:flex; flex-direction:column; align-items:center;
    padding-bottom:6px;
  }
  #screen-char > .nav-row{margin-top:8px; padding-top:0;}
  .option-block{width:100%; max-width:400px; margin-top:14px;}
  .option-label{color:#fff; font-size:13px; font-weight:bold; margin:0 0 6px 4px; text-shadow:0 1px 2px rgba(0,0,0,.3);}
  .option-row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  .opt-btn{
    background:#fff; border:3px solid transparent; border-radius:14px; padding:4px;
    box-shadow:0 3px 0 rgba(0,0,0,.15);
  }
  .opt-btn.selected{border-color:#ff9f43;}
  .opt-btn canvas{display:block; border-radius:10px;}
  .swatch{
    width:44px; height:44px; border-radius:50%; border:3px solid #fff;
    box-shadow:0 3px 0 rgba(0,0,0,.15);
  }
  .swatch.selected{border-color:#ff9f43; transform:scale(1.1);}

  /* ---- 名前入力 ---- */
  #nameDisplay{
    background:#fff; border-radius:16px; padding:14px 20px; font-size:26px;
    letter-spacing:4px; min-width:220px; min-height:40px; text-align:center;
    box-shadow:0 3px 0 rgba(0,0,0,.15); margin:14px 0; color:#333; font-weight:bold;
  }
  #nameDisplay .cursor{opacity:.4;}
  .voice-btn{
    background:#ff5c7a; color:#fff; border:none; border-radius:24px;
    padding:12px 26px; font-size:16px; font-weight:bold;
    box-shadow:0 4px 0 #c23458; margin:0 0 12px;
  }
  .voice-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #c23458;}
  .voice-btn.listening{animation:voicePulse 1s infinite;}
  @keyframes voicePulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.06);}
  }
  /* kbAreaはflexアイテムなので幅指定がないと中身のmin-content幅まで縮み、
     五十音表が極端に細くなる(キー幅18px)。width:100%で画面幅いっぱいに広げる */
  #kbArea{
    width:100%; display:flex; flex-direction:column; align-items:center;
  }
  /* 五十音表は縦に長く、画面全体をスクロールさせると「はじめる」ボタンが
     画面外に隠れて子供が見つけられない。キーボード部分だけをスクロール領域にして、
     タイトル・名前表示・下部ボタンは常に画面内に見えるようにする */
  #screen-name{overflow:hidden;}
  #screen-name > h1.title,
  #screen-name > #nameDisplay,
  #screen-name > .voice-btn,
  #screen-name > .kb-toolrow,
  #screen-name > .nav-row{flex:0 0 auto;}
  #screen-name > #kbArea{flex:1 1 auto; min-height:0; overflow-y:auto; padding:2px 0 6px;}
  #screen-name > .nav-row{margin-top:8px; padding-top:0;}
  .kb-grid{
    display:grid; gap:6px; width:100%; max-width:420px;
  }
  .kb-grid.kana{grid-template-columns:repeat(5,1fr);}
  .kb-grid.abc{grid-template-columns:repeat(6,1fr);}
  .kb-key{
    background:#fff; border:none; border-radius:10px; padding:10px 0;
    font-size:18px; font-weight:bold; color:#333; box-shadow:0 2px 0 rgba(0,0,0,.15);
  }
  .kb-key.empty{background:transparent; box-shadow:none;}
  .kb-key.wide{grid-column:span 2; background:#ffe0b2;}
  .kb-key.func{background:#d6e9ff;}
  .kb-key:active{transform:translateY(2px); box-shadow:none;}
  .kb-toolrow{display:flex; gap:8px; margin-top:8px; width:100%; max-width:420px; justify-content:center;}

  /* ---- スタート確認 ---- */
  #startSummary{color:#fff; text-align:center; text-shadow:0 1px 3px rgba(0,0,0,.35);}
  #startSummary .name{font-size:24px; font-weight:bold; margin:10px 0;}
  .placeholder-note{
    background:rgba(255,255,255,.9); border-radius:14px; padding:12px 16px;
    font-size:13px; color:#555; margin-top:18px; line-height:1.6; max-width:340px;
  }

  /* ---- マップ画面 ---- */
  #screen-map{padding:8px; justify-content:flex-start;}
  #mapWrap{position:relative; margin-top:6px; border-radius:16px; overflow:hidden; box-shadow:0 6px 0 rgba(0,0,0,.2);}
  #mapCanvas{display:block; touch-action:none;}
  .map-toast{
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.55); color:#fff; font-size:12px; padding:6px 12px;
    border-radius:20px; white-space:nowrap; pointer-events:none; opacity:0; transition:opacity .3s;
  }
  .map-toast.show{opacity:1;}
  .map-actions{
    position:absolute; left:0; right:0; bottom:14px;
    display:flex; justify-content:center; gap:12px; pointer-events:none;
  }
  .action-btn{
    pointer-events:auto;
    background:var(--accent); color:#fff; border:none; border-radius:30px;
    padding:14px 30px; font-size:17px; font-weight:bold;
    box-shadow:0 4px 0 #c9761f; opacity:0; transform:translateY(10px);
    transition:opacity .18s, transform .18s;
  }
  .action-btn.show{opacity:1; transform:translateY(0); pointer-events:auto;}
  .action-btn:not(.show){pointer-events:none;}
  .action-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #c9761f;}
  .map-bottom-row{display:flex; gap:10px; margin-top:8px;}

  /* ---- ミニゲーム共通(釣り/宝探し) ---- */
  .mini-canvas-wrap{
    border-radius:20px; overflow:hidden; margin-top:10px;
    box-shadow:0 6px 0 rgba(0,0,0,.2);
  }
  .mini-msg{
    color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.4); font-size:18px;
    font-weight:bold; text-align:center; margin:16px 0; min-height:26px;
  }
  .mini-msg.urgent{color:#fff176; font-size:24px; animation:voicePulse .4s infinite;}

  /* ---- 宝探し: 光るポイント ---- */
  #peekWrap{position:relative; margin-top:10px; border-radius:20px; overflow:hidden; box-shadow:0 6px 0 rgba(0,0,0,.2);}
  .glow-spot{
    position:absolute; width:38px; height:38px; margin:-19px 0 0 -19px;
    border-radius:50%; border:none; padding:0;
    background:radial-gradient(circle, #fff9c4 0%, #ffd54f 55%, rgba(255,213,79,0) 75%);
    box-shadow:0 0 12px 4px rgba(255,235,130,.85);
    animation:glowPulse 1s infinite;
  }
  @keyframes glowPulse{
    0%,100%{transform:scale(1); opacity:.85;}
    50%{transform:scale(1.18); opacity:1;}
  }

  /* ---- イセエビ特別演出 ---- */
  .gold-flash{
    position:fixed; inset:0; pointer-events:none; z-index:50;
    background:radial-gradient(circle at center, rgba(255,223,90,.9) 0%, rgba(255,193,7,.55) 45%, rgba(255,193,7,0) 75%);
    opacity:0; transition:opacity .35s;
  }
  .gold-flash.show{opacity:1;}

  /* ---- 図鑑 ---- */
  .zukan-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:12px;
    width:100%; max-width:380px; margin-top:10px;
  }
  .zukan-cell{
    background:rgba(255,255,255,.9); border-radius:16px; padding:8px 4px 10px;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    box-shadow:0 3px 0 rgba(0,0,0,.15); opacity:.65;
  }
  .zukan-cell.owned{opacity:1; background:#fff;}
  .zukan-cell{position:relative;}
  .zukan-count{
    position:absolute; top:4px; right:6px; min-width:26px; padding:2px 7px;
    background:var(--accent); color:#fff; font-size:13px; font-weight:bold;
    border-radius:12px; text-align:center; box-shadow:0 2px 0 #c9761f;
  }
  .zukan-cell canvas{display:block;}
  .zukan-label{font-size:12px; font-weight:bold; color:#444; text-align:center;}
  .zukan-complete-badge{
    margin-top:16px; background:rgba(255,255,255,.95); color:#c9761f;
    font-size:17px; font-weight:bold; text-align:center; border-radius:16px;
    padding:14px 18px; box-shadow:0 4px 0 rgba(0,0,0,.15); max-width:340px;
  }
  .confetti{
    position:fixed; top:-20px; width:10px; height:16px; z-index:60;
    pointer-events:none; animation:confettiFall linear forwards;
  }
  @keyframes confettiFall{
    to{ transform:translateY(110vh) rotate(540deg); opacity:.2; }
  }

  /* ---- 言語切り替えバー(全画面共通・上部固定) ---- */
  #langBar{
    position:absolute; top:0; left:0; right:0; z-index:30;
    display:flex; justify-content:center; align-items:center; gap:2px;
    height:var(--langbar-h); padding:0 4px;
    background:rgba(255,255,255,.25);
    border-bottom:1px solid rgba(255,255,255,.4);
  }
  #langBar .lang-btn{
    display:flex; align-items:center; justify-content:center;
    width:36px; height:36px; margin:0; padding:0;
    border:0; background:transparent; box-shadow:none; border-radius:7px;
  }
  #langBar .flag-canvas{
    width:28px; height:19px; opacity:.5;
    box-shadow:0 0 0 1px rgba(0,0,0,.25);
    transition:opacity .12s, transform .12s;
  }
  #langBar .lang-btn.is-active{background:rgba(255,255,255,.6);}
  #langBar .lang-btn.is-active .flag-canvas{opacity:1; box-shadow:0 0 0 2px var(--accent);}
  #langBar .lang-btn:active .flag-canvas{transform:scale(.9);}

  /* 言語バーに隠れないよう各画面を下げる(既存の padding 指定より後に置いて上書きする) */
  .screen{padding-top:calc(var(--langbar-h) + 4px);}
  #screen-map{padding-top:calc(var(--langbar-h) + 4px);}

  /* ---- リール(釣りの引き寄せ) ---- */
  #reelArea{
    display:none; touch-action:none; margin-top:4px;
    align-items:center; justify-content:center;
  }
  #reelArea.show{display:flex;}
  /* 指でぐるぐるなぞる輪。実際の大きさは layoutReel() が
     「海の絵と下のボタンを残した残りの高さ」から計算して指定する */
  #reelDial{display:block; touch-action:none;}
  /* 巻いている間も海は消さず、絵を小さくして円と並べる */
  #screen-fish.reeling #fishCanvas{width:170px; height:170px;}
  #screen-fish.reeling .mini-msg{margin:2px 0;}
  @media (max-height:700px){
    #fishCanvas{width:216px; height:216px;}
  }
</style>
</head>
<body>
<div id="app">

  <!-- 言語切り替え(魚種判別アプリと同じく、上の国旗をタップして切り替える) -->
  <nav id="langBar" aria-label="Language / 言語切替">
    <button type="button" class="lang-btn is-active" data-lang="ja" aria-label="日本語"><canvas class="flag-canvas" data-flag="ja" width="42" height="28"></canvas></button>
    <button type="button" class="lang-btn" data-lang="en" aria-label="English"><canvas class="flag-canvas" data-flag="en" width="42" height="28"></canvas></button>
    <button type="button" class="lang-btn" data-lang="zh" aria-label="中文"><canvas class="flag-canvas" data-flag="zh" width="42" height="28"></canvas></button>
    <button type="button" class="lang-btn" data-lang="ko" aria-label="한국어"><canvas class="flag-canvas" data-flag="ko" width="42" height="28"></canvas></button>
    <button type="button" class="lang-btn" data-lang="es" aria-label="Español"><canvas class="flag-canvas" data-flag="es" width="42" height="28"></canvas></button>
    <button type="button" class="lang-btn" data-lang="it" aria-label="Italiano"><canvas class="flag-canvas" data-flag="it" width="42" height="28"></canvas></button>
    <button type="button" class="lang-btn" data-lang="vi" aria-label="Tiếng Việt"><canvas class="flag-canvas" data-flag="vi" width="42" height="28"></canvas></button>
    <button type="button" class="lang-btn" data-lang="tl" aria-label="Tagalog"><canvas class="flag-canvas" data-flag="tl" width="42" height="28"></canvas></button>
  </nav>

  <!-- 2. キャラメイク -->
  <div class="screen active" id="screen-char">
    <h1 class="title" data-i18n="charTitle" style="margin-top:6px;"></h1>
    <div class="char-preview-wrap">
      <canvas id="charCanvas" width="180" height="220"></canvas>
    </div>

    <div id="charOptions">
    <div class="option-block">
      <div class="option-label" data-i18n="optGender"></div>
      <div class="option-row" id="row-gender"></div>
    </div>
    <div class="option-block">
      <div class="option-label" data-i18n="optHair"></div>
      <div class="option-row" id="row-hair"></div>
    </div>
    <div class="option-block">
      <div class="option-label" data-i18n="optHairColor"></div>
      <div class="option-row" id="row-hairColor"></div>
    </div>
    <div class="option-block">
      <div class="option-label" data-i18n="optSkin"></div>
      <div class="option-row" id="row-skin"></div>
    </div>
    <div class="option-block">
      <div class="option-label" data-i18n="optCloth"></div>
      <div class="option-row" id="row-cloth"></div>
    </div>
    <div class="option-block">
      <div class="option-label" data-i18n="optPants"></div>
      <div class="option-row" id="row-pants"></div>
    </div>
    </div>

    <div class="nav-row">
      <button class="big-btn" id="btnCharNext" data-i18n="next"></button>
    </div>
  </div>

  <!-- 3. 名前入力 -->
  <div class="screen" id="screen-name">
    <h1 class="title" data-i18n="nameTitle"></h1>
    <div id="nameDisplay"><span id="nameText"></span><span class="cursor">|</span></div>
    <button class="voice-btn" id="btnVoice" style="display:none;" data-i18n="voiceBtn"></button>
    <div id="kbArea"></div>
    <div class="kb-toolrow">
      <button class="ghost-btn" id="btnBackspace" data-i18n="delete"></button>
      <button class="ghost-btn" id="btnSkipName" data-i18n="skip"></button>
    </div>
    <div class="nav-row">
      <button class="ghost-btn" id="btnNameBack" data-i18n="back"></button>
      <button class="big-btn" id="btnNameNext" data-i18n="start"></button>
    </div>
  </div>

  <!-- 4. スタート確認 -->
  <div class="screen" id="screen-start">
    <canvas id="startCharCanvas" width="150" height="185" style="margin-top:20px;"></canvas>
    <div id="startSummary">
      <div class="name" id="startName"></div>
      <div data-i18n="readyMsg"></div>
    </div>
    <div class="nav-row">
      <button class="big-btn" id="btnGoMap" data-i18n="goMap"></button>
    </div>
    <div class="nav-row" style="margin-top:0;">
      <button class="ghost-btn" id="btnStartBack" data-i18n="back"></button>
      <button class="ghost-btn" id="btnRestart" data-i18n="backToTop"></button>
    </div>
  </div>

  <!-- 5. マップ(本番: 目黒店の間取り図ベース) -->
  <div class="screen" id="screen-map">
    <div id="mapWrap">
      <canvas id="mapCanvas"></canvas>
      <div class="map-toast" id="mapToast"></div>
      <div class="map-actions">
        <button class="action-btn" id="btnFish" data-i18n="fishBtn"></button>
        <button class="action-btn" id="btnPeek" data-i18n="peekBtn"></button>
      </div>
    </div>
    <div class="map-bottom-row">
      <button class="ghost-btn" id="btnZukan" data-i18n="zukanBtn"></button>
      <button class="ghost-btn" id="btnMapHome" data-i18n="homeBtn"></button>
    </div>
  </div>

  <!-- 6a. 釣りミニゲーム -->
  <div class="screen" id="screen-fish">
    <h1 class="title" data-i18n="fishTitle"></h1>
    <div class="mini-canvas-wrap"><canvas id="fishCanvas" width="280" height="280"></canvas></div>
    <div class="mini-msg" id="fishMsg"></div>
    <!-- リール: 指でぐるぐるなぞって巻き上げる。引き寄せ中だけ出す -->
    <div id="reelArea"><canvas id="reelDial" width="260" height="260"></canvas></div>
    <div class="nav-row" id="fishResultActions" style="display:none;">
      <button class="big-btn" id="btnFishRetry" data-i18n="retryBtn"></button>
      <button class="ghost-btn" id="btnFishBack" data-i18n="back"></button>
    </div>
    <button class="ghost-btn" id="btnFishCancel" data-i18n="back" style="margin-top:auto;"></button>
  </div>

  <!-- 6b. 宝探しミニゲーム -->
  <div class="screen" id="screen-peek">
    <h1 class="title" data-i18n="peekTitle"></h1>
    <div id="peekWrap"><canvas id="peekCanvas" width="280" height="280"></canvas></div>
    <div class="mini-msg" id="peekMsg" data-i18n="peekInstruction"></div>
    <div class="nav-row" id="peekResultActions" style="display:none;">
      <button class="big-btn" id="btnPeekRetry" data-i18n="retryBtn"></button>
      <button class="ghost-btn" id="btnPeekBack" data-i18n="back"></button>
    </div>
    <button class="ghost-btn" id="btnPeekCancel" data-i18n="back" style="margin-top:auto;"></button>
  </div>

  <!-- 7. 図鑑 -->
  <div class="screen" id="screen-zukan">
    <h1 class="title" data-i18n="zukanTitle"></h1>
    <div class="zukan-grid" id="zukanGrid"></div>
    <div class="zukan-complete-badge" id="zukanComplete" style="display:none;"></div>
    <div class="nav-row">
      <button class="ghost-btn" id="btnZukanBack" data-i18n="back"></button>
    </div>
  </div>

</div>

<script>
"use strict";

/* ============ i18n ============ */
const I18N = {
  ja:{
    charTitle:"キャラをつくろう", optGender:"せいべつ", optHair:"かみがた",
    optHairColor:"かみのいろ", optSkin:"はだのいろ", optCloth:"ふくのいろ", optPants:"したのいろ",
    next:"つぎへ", back:"もどる", skip:"スキップ", start:"はじめる",
    nameTitle:"なまえをいれてね", delete:"けす",
    readyMsg:"じゅんびOK！", backToTop:"さいしょから",
    goMap:"たんけんへ！", fishBtn:"つる", peekBtn:"のぞく",
    homeBtn:"さいしょから",

/* 当たり枠。獲ったときに画面が金色に光る */
const RARE_TREASURES = ["ise","awabi"];
function weightedPick(table){
  const total = table.reduce((s,[,w])=>s+w,0);
  let r = Math.random()*total;
  for(const [k,w] of table){ r -= w; if(r <= 0) return k; }
  return table[table.length-1][0];
}

const SPECIES_IMAGES = {};         // key → 読み込み済みの Image
const SPECIES_SILHOUETTES = {}; // key → 灰色に塗りつぶした影絵(未獲得の図鑑・引き寄せ中の魚)
Object.keys(SPECIES_IMAGE_SRC).forEach(key=>{
  const img = new Image();
  img.onload = ()=>{
    SPECIES_IMAGES[key] = img;
    // 図鑑を開いている最中に読み込み終わったら描き直す
    const zukan = document.getElementById("screen-zukan");
    if(zukan && zukan.classList.contains("active")) buildZukanGrid();
  };
  img.src = SPECIES_IMAGE_SRC[key];
});

function speciesSilhouette(key){
  if(SPECIES_SILHOUETTES[key]) return SPECIES_SILHOUETTES[key];
  const img = SPECIES_IMAGES[key];
  const c = document.createElement("canvas");
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const x = c.getContext("2d");
  x.drawImage(img, 0, 0);
  x.globalCompositeOperation = "source-in";
  x.fillStyle = "#aab3ba";
  x.fillRect(0, 0, c.width, c.height);
  SPECIES_SILHOUETTES[key] = c;
  return c;
}

const SPECIES_INFO = {
  aji:{type:"fish", color:"#9fd8ff", accent:"#6fb8e8"},
  kasago:{type:"fish", color:"#c9705a", accent:"#8a3f2c", spiny:true},
  shimaaji:{type:"fish", color:"#bfe6c9", accent:"#4c7a55", stripe:true},
  tai:{type:"fish", color:"#ffb3c1", accent:"#e8607d"},
  hirame:{type:"flatfish", color:"#c9a06a", accent:"#8a6a3d"},
  sazae:{type:"shell", color:"#d98a3d", accent:"#a85f22", imgBox:[0.8, 0.8]},
  awabi:{type:"abalone", color:"#7fa89b", accent:"#3f5f57", imgBox:[0.9, 0.7]},
  ebi:{type:"shrimp", color:"#f7f5f0", accent:"#6f7b88", scale:0.78},   // 白っぽく、イセエビより小さく表示(図鑑の白いカードで埋もれないよう輪郭は濃いめ)
  ise:{type:"shrimp", color:"#ff6b6b", accent:"#c23458", spiny:true, scale:1.2, imgBox:[0.96, 0.9]}  // オーナー指示で大きく(クルマエビの約1.55倍)
};

function drawSpeciesIcon(ctx, w, h, key, silhouette){
  ctx.clearRect(0,0,w,h);
  drawSpeciesGraphic(ctx, w, h, key, silhouette);
}

function drawSpeciesGraphic(ctx, w, h, key, silhouette){
  const info = SPECIES_INFO[key];
  // イラストがある種類はそれで描く。枠(w×h)の imgBox の割合の中に縦横比を保って収め、中央に置く。
  // (info.scale は自前描画用。イラストの大きさは imgBox だけで決める)
  const img = SPECIES_IMAGES[key];
  if(img){
    const src = silhouette ? speciesSilhouette(key) : img;
    const box = info.imgBox || [0.86, 0.7];
    const k = Math.min(w*box[0]/img.naturalWidth, h*box[1]/img.naturalHeight);
    const dw = img.naturalWidth*k, dh = img.naturalHeight*k;
    ctx.drawImage(src, (w-dw)/2, (h-dh)/2, dw, dh);
    return;
  }
  const main = silhouette ? "#aab3ba" : info.color;
  const accent = silhouette ? "#8c959c" : info.accent;
  ctx.save();
  ctx.translate(w/2, h/2);
  // SPECIES_INFO に scale があれば、その種類だけ大きさを変えて描く
  // (クルマエビをイセエビより小さく見せるため。図鑑・釣り上げ演出・カゴの演出すべてに効く)
  if(info.scale) ctx.scale(info.scale, info.scale);
  if(info.type === "fish" || info.type === "flatfish"){
    const bw = w*0.34, bh = info.type==="flatfish" ? h*0.24 : h*0.19;
    ctx.fillStyle = main;
    ctx.beginPath(); ctx.ellipse(0,0,bw,bh,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(bw*0.85,0); ctx.lineTo(bw*1.35,-bh*0.9); ctx.lineTo(bw*1.35,bh*0.9); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = silhouette ? "#7a838a" : "#2c2c2c";
    ctx.beginPath(); ctx.arc(-bw*0.55,-bh*0.15,bh*0.17,0,Math.PI*2); ctx.fill();
    if(info.stripe && !silhouette){
      ctx.strokeStyle = accent; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-bw*0.7,-bh*0.5); ctx.lineTo(bw*0.5,bh*0.5); ctx.stroke();
    }
    if(info.spiny){
      ctx.fillStyle = main;
      for(let i=-2;i<=2;i++){
        const sx = i*bw*0.28;
        ctx.beginPath();
        ctx.moveTo(sx-4, -bh*0.85);
        ctx.lineTo(sx, -bh*1.4);
        ctx.lineTo(sx+4, -bh*0.85);
        ctx.closePath();
        ctx.fill();
      }
    }
  } else if(info.type === "shell"){
    ctx.strokeStyle = main; ctx.lineWidth = w*0.08; ctx.lineCap = "round";
    const maxA = Math.PI*2*3, maxR = w*0.36;
    ctx.beginPath();
    for(let a=0.5; a<=maxA; a+=0.15){
      const r = (a/maxA)*maxR;
      const x = Math.cos(a)*r, y = Math.sin(a)*r;
      if(a===0.5) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  } else if(info.type === "abalone"){
    // アワビ: 平たい耳のような殻。ふちに沿って穴が一列に並ぶのがサザエとの見分け
    const rx = w*0.34, ry = h*0.26;
    ctx.fillStyle = main;
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, -0.25, 0, Math.PI*2);
    ctx.fill();
    if(!silhouette){
      // 内側の真珠光沢
      ctx.fillStyle = "rgba(255,255,255,.35)";
      ctx.beginPath();
      ctx.ellipse(-rx*0.18, -ry*0.18, rx*0.55, ry*0.5, -0.25, 0, Math.PI*2);
      ctx.fill();
      // 成長線
      ctx.strokeStyle = accent; ctx.lineWidth = 1.2;
      for(let i=1;i<=3;i++){
        ctx.beginPath();
        ctx.ellipse(0, 0, rx*(0.35+i*0.2), ry*(0.35+i*0.2), -0.25, Math.PI*0.15, Math.PI*1.0);
        ctx.stroke();
      }
    }
    // ふちの穴
    ctx.fillStyle = silhouette ? "#7a838a" : accent;
    for(let i=0;i<4;i++){
      const a = Math.PI*1.12 + i*0.17;
      ctx.beginPath();
      ctx.arc(Math.cos(a)*rx*0.72, Math.sin(a)*ry*0.72, Math.max(1.4, w*0.028), 0, Math.PI*2);
      ctx.fill();
    }
    ctx.strokeStyle = silhouette ? "#8c959c" : accent;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, -0.25, 0, Math.PI*2);
    ctx.stroke();
  } else if(info.type === "shrimp"){
    // エビ: 円弧に沿って節(体の輪)を並べ、片端に尾びれ、反対の端に頭・目・ヒゲを付ける。
    // 背は円弧の外側、腹(脚)は内側。イセエビ(spiny)は背にトゲとヒゲを太くして見分ける
    const R = w*0.21, segs = 7;
    const a0 = Math.PI*0.85, a1 = Math.PI*1.85;   // a0=頭 a1=尾
    const pt = (a)=> [Math.cos(a)*R, Math.sin(a)*R];
    // 頭のヒゲが左に長く出るぶん絵が左に寄っている。少し右へずらして見た目の中心をマスの中心に合わせる
    // (これをしないと scale を上げたときに図鑑のマスからヒゲがはみ出して切れる)
    ctx.translate(w*0.085, 0);

    // 脚(腹側=円弧の内側)
    if(!silhouette){
      ctx.strokeStyle = accent; ctx.lineWidth = 1.3; ctx.lineCap = "round";
      for(let i=1;i<=4;i++){
        const tt=i/5.5, a=a0+(a1-a0)*tt, [x,y]=pt(a);
        ctx.beginPath();
        ctx.moveTo(x,y);
        ctx.lineTo(x-Math.cos(a)*w*0.11, y-Math.sin(a)*w*0.11);
        ctx.stroke();
      }
      ctx.lineCap = "butt";
    }
    // 尾びれ
    const [tx,ty] = pt(a1);
    ctx.fillStyle = main;
    for(let k=-1;k<=1;k++){
      const ang = a1 + Math.PI*0.5 + k*0.45;
      ctx.beginPath();
      ctx.moveTo(tx,ty);
      ctx.lineTo(tx+Math.cos(ang)*w*0.17, ty+Math.sin(ang)*w*0.17);
      ctx.lineTo(tx+Math.cos(ang+0.32)*w*0.15, ty+Math.sin(ang+0.32)*w*0.15);
      ctx.closePath(); ctx.fill();
    }
    // 胴体の節(頭側が太く尾に向かって細くなる)
    for(let i=0;i<segs;i++){
      const tt = i/(segs-1), a = a0+(a1-a0)*tt, [x,y] = pt(a);
      const rr = w*0.115*(1-tt*0.55);
      ctx.fillStyle = main;
      ctx.beginPath(); ctx.arc(x,y,rr,0,Math.PI*2); ctx.fill();
      if(!silhouette && i>0){
        ctx.strokeStyle = accent; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(x,y,rr,0,Math.PI*2); ctx.stroke();
      }
    }
    // 背中のトゲ(イセエビ)
    if(info.spiny && !silhouette){
      ctx.strokeStyle = accent; ctx.lineWidth = 1.8; ctx.lineCap = "round";
      for(let i=0;i<4;i++){
        const tt=(i+0.4)/5.5, a=a0+(a1-a0)*tt, [x,y]=pt(a);
        ctx.beginPath();
        ctx.moveTo(x,y);
        ctx.lineTo(x+Math.cos(a)*w*0.115, y+Math.sin(a)*w*0.115);
        ctx.stroke();
      }
      ctx.lineCap = "butt";
    }
    // 頭・目・ヒゲ
    const [hx,hy] = pt(a0);
    ctx.strokeStyle = silhouette ? "#8c959c" : accent;
    ctx.lineWidth = info.spiny ? 2.4 : 1.4;
    ctx.lineCap = "round";
    for(let k=0;k<2;k++){
      ctx.beginPath();
      ctx.moveTo(hx,hy);
      ctx.quadraticCurveTo(hx-w*0.15, hy+w*0.12+k*w*0.07,
                           hx-w*0.29, hy+w*0.04+k*w*0.13);
      ctx.stroke();
    }
    ctx.lineCap = "butt";
    ctx.fillStyle = silhouette ? "#7a838a" : "#2c2c2c";
    ctx.beginPath();
    ctx.arc(hx+w*0.035, hy-w*0.02, Math.max(1.6,w*0.03), 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

const HAIR_COLORS = ["#2b2320","#6b4423","#d9a441","#8b3a2f"];
const SKIN_TONES  = ["#ffe0bd","#ffcd94","#eaa970","#c68642"];
const CLOTH_COLORS= ["#2e86de","#10ac84","#ff9f43","#ff6b9d","#3b4a5a"];
const BOY_HAIR_STYLES  = ["buzz","sport","medium","curly","longstraight"];
const GIRL_HAIR_STYLES = ["short","dango","twintail","ponytail","straight","curly"];
function hairStylesForGender(g){ return g==="girl" ? GIRL_HAIR_STYLES : BOY_HAIR_STYLES; }
// 性別ごとの初期髪型(男の子=ミディアム、女の子=ロング)
function defaultHairForGender(g){ return g==="girl" ? "straight" : "sport"; }
function defaultChar(){ return { gender:"boy", hair:defaultHairForGender("boy"), hairColor:0, skin:0, cloth:0, pants:4 }; }

/* ============ 国旗描画(Windowsの絵文字フォントが国旗絵文字を正しく描画しない機種があるため、
   すべてCanvas図形で自前生成する。英語(🇺🇸)は絵文字のまま表示できているのでそのまま) ============ */
function drawStar(ctx, cx, cy, r, rotation){
  const inner = r * 0.382;
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const rad = i%2===0 ? r : inner;
    const ang = rotation + i*Math.PI/5;
    const x = cx + Math.cos(ang)*rad, y = cy + Math.sin(ang)*rad;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fill();
}

function drawFlagJapan(ctx,w,h){
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h);
  ctx.fillStyle="#bc002d";
  ctx.beginPath(); ctx.arc(w/2,h/2,h*0.32,0,Math.PI*2); ctx.fill();
}

function drawFlagChina(ctx,w,h){
  ctx.fillStyle="#de2910"; ctx.fillRect(0,0,w,h);
  ctx.fillStyle="#ffde00";
  const bigX=w*0.22, bigY=h*0.32;
  drawStar(ctx, bigX, bigY, h*0.24, -Math.PI/2);
  [[w*0.42,h*0.10],[w*0.48,h*0.26],[w*0.45,h*0.44],[w*0.36,h*0.55]].forEach(([sx,sy])=>{
    const ang = Math.atan2(bigY-sy, bigX-sx) - Math.PI/2;
    drawStar(ctx, sx, sy, h*0.08, ang);
  });
}

function drawTrigram(ctx,x,y,w,barH,gap,pattern){
  pattern.forEach((solid,i)=>{
    const yy = y + i*gap;
    if(solid) ctx.fillRect(x,yy,w,barH);
    else{ ctx.fillRect(x,yy,w*0.42,barH); ctx.fillRect(x+w*0.58,yy,w*0.42,barH); }
  });
}

function drawFlagKorea(ctx,w,h){
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h);
  const cx=w/2, cy=h/2, r=h*0.26;
  ctx.save();
  ctx.translate(cx,cy); ctx.rotate(Math.PI/4);
  ctx.fillStyle="#c60c30";
  ctx.beginPath(); ctx.arc(0,0,r,-Math.PI/2,Math.PI/2); ctx.fill();
  ctx.fillStyle="#003478";
  ctx.beginPath(); ctx.arc(0,0,r,Math.PI/2,Math.PI*1.5); ctx.fill();
  ctx.fillStyle="#003478";
  ctx.beginPath(); ctx.arc(0,-r/2,r/2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#c60c30";
  ctx.beginPath(); ctx.arc(0,r/2,r/2,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.fillStyle="#000";
  const barW=w*0.15, barH=h*0.035, gap=h*0.06;
  drawTrigram(ctx, w*0.05, h*0.12, barW, barH, gap, [1,1,1]);
  drawTrigram(ctx, w*0.80, h*0.12, barW, barH, gap, [1,0,1]);
  drawTrigram(ctx, w*0.05, h*0.72, barW, barH, gap, [0,1,0]);
  drawTrigram(ctx, w*0.80, h*0.72, barW, barH, gap, [0,0,0]);
}

function drawFlagUSA(ctx,w,h){
  const stripeH = h/7;
  for(let i=0;i<7;i++){
    ctx.fillStyle = i%2===0 ? "#b22234" : "#fff";
    ctx.fillRect(0, i*stripeH, w, stripeH);
  }
  const cantonW = w*0.42, cantonH = stripeH*4;
  ctx.fillStyle = "#3c3b6e";
  ctx.fillRect(0,0,cantonW,cantonH);
  ctx.fillStyle = "#fff";
  const cols=5, rows=4;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const x = cantonW*(c+0.5)/cols, y = cantonH*(r+0.5)/rows;
      ctx.beginPath(); ctx.arc(x,y,1.3,0,Math.PI*2); ctx.fill();
    }
  }
}

function drawFlagSpain(ctx,w,h){
  ctx.fillStyle="#c60b1e"; ctx.fillRect(0,0,w,h);
  ctx.fillStyle="#ffc400"; ctx.fillRect(0,h*0.25,w,h*0.5);
}

function drawFlagItaly(ctx,w,h){
  const stripeW = w/3;
  ctx.fillStyle="#008c45"; ctx.fillRect(0,0,stripeW,h);
  ctx.fillStyle="#fff"; ctx.fillRect(stripeW,0,stripeW,h);
  ctx.fillStyle="#cd212a"; ctx.fillRect(stripeW*2,0,stripeW,h);
}

function drawFlagVietnam(ctx,w,h){
  ctx.fillStyle="#da251d"; ctx.fillRect(0,0,w,h);
  ctx.fillStyle="#ff0";
  drawStar(ctx, w/2, h/2, h*0.32, -Math.PI/2);
}

function drawFlagPhilippines(ctx,w,h){
  ctx.fillStyle="#0038a8"; ctx.fillRect(0,0,w,h/2);
  ctx.fillStyle="#ce1126"; ctx.fillRect(0,h/2,w,h/2);
  ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(w*0.55,h/2); ctx.lineTo(0,h); ctx.closePath();
  ctx.fill();
  const sunX=w*0.19, sunY=h/2, sunR=h*0.11;
  ctx.fillStyle="#fcd116";
  ctx.save();
  ctx.translate(sunX,sunY);
  for(let i=0;i<8;i++){
    ctx.rotate(Math.PI/4);
    ctx.beginPath();
    ctx.moveTo(-sunR*0.25,0);
    ctx.lineTo(0,-sunR*1.8);
    ctx.lineTo(sunR*0.25,0);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(sunX,sunY,sunR*0.55,0,Math.PI*2); ctx.fill();
  drawStar(ctx, w*0.04, h*0.08, h*0.055, -Math.PI/2);
  drawStar(ctx, w*0.04, h*0.92, h*0.055, -Math.PI/2);
  drawStar(ctx, w*0.50, h*0.5, h*0.055, -Math.PI/2);
}

function drawFlagCanvases(){
  const map = { en:drawFlagUSA, ja:drawFlagJapan, zh:drawFlagChina, ko:drawFlagKorea, es:drawFlagSpain, it:drawFlagItaly, vi:drawFlagVietnam, tl:drawFlagPhilippines };
  document.querySelectorAll(".flag-canvas").forEach(c=>{
    const fn = map[c.getAttribute("data-flag")];
    if(fn) fn(c.getContext("2d"), c.width, c.height);
  });
}

/* ============ キャラクター描画(すべてCanvas図形、画像素材なし) ============ */
// 左上から光が当たっている想定の疑似3D陰影。球体パーツ(頭・お団子等)はradialで、
// 円柱・角柱パーツ(腕脚・胴体)はlinearで、それぞれ明暗をつけて立体感を出す
function sphereFill(ctx, cx, cy, r, base){
  const g = ctx.createRadialGradient(cx-r*0.38, cy-r*0.42, r*0.1, cx, cy, r*1.05);
  g.addColorStop(0, hairShade(base, 50));
  g.addColorStop(0.55, base);
  g.addColorStop(1, hairShade(base, -35));
  return g;
}
function cylFill(ctx, x0, x1, y, base){
  const g = ctx.createLinearGradient(x0, y, x1, y);
  g.addColorStop(0, hairShade(base, -15));
  g.addColorStop(0.4, hairShade(base, 30));
  g.addColorStop(1, hairShade(base, -45));
  return g;
}

function drawCharacter(ctx, w, h, opts){
  ctx.clearRect(0,0,w,h);
  const skin = SKIN_TONES[opts.skin];
  const hairColor = HAIR_COLORS[opts.hairColor];
  const cloth = CLOTH_COLORS[opts.cloth];
  const pants = CLOTH_COLORS[opts.pants];
  const scale = w/180;

  ctx.save();
  ctx.scale(scale,scale);
  const W = 180, H = 220;
  const ccx = W/2;

  const skinLine = hairShade(skin, -55);
  const clothLine = hairShade(cloth, -55);
  const pantsLine = hairShade(pants, -45);

  // 影(地面の落ち影)
  ctx.fillStyle = "rgba(0,0,0,0.18)";
  ctx.beginPath();
  ctx.ellipse(ccx, 205, 37, 7, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.lineJoin = "round";

  // 脚(性別で形を変える: 男の子=ズボン、女の子=スカート。色は「したのいろ」で選択)
  if(opts.gender === "girl"){
    ctx.fillStyle = cylFill(ctx, ccx-42, ccx+42, 170, pants);
    ctx.strokeStyle = pantsLine; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(ccx-30, 150);
    ctx.lineTo(ccx+30, 150);
    ctx.lineTo(ccx+42, 190);
    ctx.lineTo(ccx-42, 190);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = skinLine; ctx.lineWidth = 1.4;
    ctx.fillStyle = cylFill(ctx, ccx-18, ccx-6, 190, skin);
    ctx.fillRect(ccx-18, 178, 12, 26); ctx.strokeRect(ccx-18, 178, 12, 26);
    ctx.fillStyle = cylFill(ctx, ccx+6, ccx+18, 190, skin);
    ctx.fillRect(ccx+6, 178, 12, 26); ctx.strokeRect(ccx+6, 178, 12, 26);
  } else {
    ctx.strokeStyle = pantsLine; ctx.lineWidth = 1.6;
    ctx.fillStyle = cylFill(ctx, ccx-24, ccx-6, 180, pants);
    ctx.fillRect(ccx-24, 160, 18, 44); ctx.strokeRect(ccx-24, 160, 18, 44);
    ctx.fillStyle = cylFill(ctx, ccx+6, ccx+24, 180, pants);
    ctx.fillRect(ccx+6, 160, 18, 44); ctx.strokeRect(ccx+6, 160, 18, 44);
    ctx.strokeStyle = skinLine; ctx.lineWidth = 1.4;
    ctx.fillStyle = cylFill(ctx, ccx-24, ccx-6, 200, skin);
    ctx.fillRect(ccx-24, 196, 18, 10); ctx.strokeRect(ccx-24, 196, 18, 10);
    ctx.fillStyle = cylFill(ctx, ccx+6, ccx+24, 200, skin);
    ctx.fillRect(ccx+6, 196, 18, 10); ctx.strokeRect(ccx+6, 196, 18, 10);
  }

  // 体(服): 縦の円柱として陰影をつけ、裾側にお腹の丸みハイライトを重ねる
  ctx.fillStyle = cylFill(ctx, ccx-38, ccx+38, 135, cloth);
  roundRect(ctx, ccx-38, 105, 76, 65, 18);
  ctx.fill();
  ctx.strokeStyle = clothLine; ctx.lineWidth = 1.8; ctx.stroke();
  ctx.save();
  ctx.globalAlpha = 0.28;
  ctx.fillStyle = hairShade(cloth, 55);
  ctx.beginPath(); ctx.ellipse(ccx-14, 122, 12, 20, 0.15, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // 腕(球体寄りの丸みでハイライトをつけ、肩の付け根に軽いAO影)
  ctx.fillStyle = sphereFill(ctx, ccx-42, 130, 16, skin);
  ctx.strokeStyle = skinLine; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.ellipse(ccx-42, 135, 11, 20, 0.3, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = sphereFill(ctx, ccx+42, 130, 16, skin);
  ctx.beginPath(); ctx.ellipse(ccx+42, 135, 11, 20, -0.3, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.save();
  ctx.globalAlpha = 0.2;
  ctx.fillStyle = "#000";
  ctx.beginPath(); ctx.ellipse(ccx-36, 118, 8, 6, 0.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(ccx+36, 118, 8, 6, -0.3, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // 首(顎の下にAO影を軽く落として頭との段差を出す)
  ctx.fillStyle = cylFill(ctx, ccx-10, ccx+10, 104, skin);
  ctx.fillRect(ccx-10, 95, 20, 18);
  ctx.save();
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = "#000";
  ctx.beginPath(); ctx.ellipse(ccx, 98, 11, 4, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // 頭(球体グラデーションで立体感)
  ctx.fillStyle = sphereFill(ctx, ccx, 62, 46, skin);
  ctx.strokeStyle = skinLine; ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.arc(ccx, 62, 46, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();

  // 目(小さなハイライトを入れてつやを出す)
  ctx.fillStyle = "#3a2c20";
  ctx.beginPath(); ctx.arc(ccx-16, 64, 4.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(ccx+16, 64, 4.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.beginPath(); ctx.arc(ccx-17.5, 62.5, 1.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(ccx+14.5, 62.5, 1.3, 0, Math.PI*2); ctx.fill();
  // ほっぺ
  ctx.fillStyle = "rgba(255,140,140,0.45)";
  ctx.beginPath(); ctx.arc(ccx-28, 74, 6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(ccx+28, 74, 6, 0, Math.PI*2); ctx.fill();
  // 口
  ctx.strokeStyle = "#3a2c20"; ctx.lineWidth = 2.2; ctx.lineCap="round";
  ctx.beginPath(); ctx.arc(ccx, 74, 8, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();

  // 髪
  drawHair(ctx, ccx, opts.hair, hairColor, opts.gender);

  ctx.restore();
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// 16進カラーを明るく/暗くする(あつもり風の縁取り・ハイライト用)。amtは-255〜255
function hairShade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r = (n>>16) + amt, g = ((n>>8)&0xff) + amt, b = (n&0xff) + amt;
  r = Math.max(0,Math.min(255,r)); g = Math.max(0,Math.min(255,g)); b = Math.max(0,Math.min(255,b));
  return "#" + ((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

function drawHair(ctx, ccx, style, color, gender){
  const outline = hairShade(color, -60);
  const shine   = hairShade(color, 60);
  ctx.fillStyle = color;
  ctx.strokeStyle = outline;
  ctx.lineWidth = 2.4;
  ctx.lineJoin = "round";

  // 頭頂〜前髪までを1本のパスで描く「おわん型」の髪本体。
  // 以前は頭頂キャップと前髪キャップを別々の円で重ね塗りしていたため、
  // 縁取り線が二重になって「帽子をかぶっているような」段差が出ていた。
  // 1本のパスに統合することで継ぎ目のない自然な輪郭にする
  function dome(topY, sideY, sideX, bangDipY, bangW){
    ctx.fillStyle = color; ctx.strokeStyle = outline;
    ctx.beginPath();
    ctx.moveTo(ccx-sideX, sideY);
    ctx.quadraticCurveTo(ccx-sideX-4, topY-10, ccx, topY);
    ctx.quadraticCurveTo(ccx+sideX+4, topY-10, ccx+sideX, sideY);
    ctx.quadraticCurveTo(ccx+bangW, (bangDipY+sideY)/2, ccx, bangDipY);
    ctx.quadraticCurveTo(ccx-bangW, (bangDipY+sideY)/2, ccx-sideX, sideY);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  }
  // 横に垂れる毛束をS字ベジェで描く(まっすぐな角柱でなく揺れを出す。側面の房・お団子/ポニーテールの尻尾に共用)
  function lock(x, topY, w, len, bend){
    ctx.fillStyle = color; ctx.strokeStyle = outline;
    const midX = x + bend, botX = x + bend*1.6;
    ctx.beginPath();
    ctx.moveTo(x-w/2, topY);
    ctx.quadraticCurveTo(midX-w/2, topY+len*0.5, botX-w*0.3, topY+len);
    ctx.quadraticCurveTo(botX, topY+len*1.05, botX+w*0.3, topY+len);
    ctx.quadraticCurveTo(midX+w/2, topY+len*0.5, x+w/2, topY);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  }
  // つやのハイライト(半透明の明るい斑)。フラットな塗りに立体感を足す
  function shineDab(x, y, w, h, rot){
    ctx.save();
    ctx.fillStyle = shine;
    ctx.globalAlpha = 0.35;
    ctx.beginPath();
    ctx.ellipse(x, y, w, h, rot, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  // お団子(ツインお団子・お団子ヘア用)
  function bun(x, y, r){
    ctx.fillStyle = color; ctx.strokeStyle = outline;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.save();
    ctx.strokeStyle = outline; ctx.lineWidth = 1.2; ctx.globalAlpha = 0.55;
    ctx.beginPath(); ctx.arc(x, y, r*0.55, 0, Math.PI*1.4); ctx.stroke();
    ctx.restore();
  }
  // 結び目のヘアゴム
  function tie(x, y){
    ctx.save();
    ctx.fillStyle = "#ff6b9d";
    ctx.strokeStyle = hairShade("#ff6b9d", -60);
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.ellipse(x, y, 9, 6, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  if(style === "buzz"){
    // 坊主: ごく薄い地肌の丸刈りタッチ+刈り込みの質感ライン(ベースキャップなし)
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.arc(ccx, 58, 45, Math.PI, 0, false);
    ctx.fill();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = outline; ctx.lineWidth = 1.2;
    for(let i=-3;i<=3;i++){
      ctx.beginPath();
      ctx.moveTo(ccx+i*11, 20); ctx.lineTo(ccx+i*11, 30);
      ctx.stroke();
    }
    ctx.restore();
    return;
  }

  shineDab(ccx-18, 30, 14, 9, -0.3);

  if(style === "sport" || style === "short"){
    dome(16, 52, 45, 54, 25);
  } else if(style === "medium"){
    lock(ccx-45, 50, 13, 40, -7);
    lock(ccx+45, 50, 13, 40,  7);
    dome(16, 52, 45, 54, 25); // 房の付け根をおわん型で隠して滑らかにつなげる
  } else if(style === "longstraight" || style === "straight"){
    lock(ccx-45, 50, 13, 90, -10);
    lock(ccx+45, 50, 13, 90,  10);
    dome(16, 52, 45, 54, 25);
  } else if(style === "dango"){
    dome(16, 52, 45, 54, 25);
    bun(ccx-46, 24, 15);
    bun(ccx+46, 24, 15);
  } else if(style === "twintail"){
    lock(ccx-44, 54, 14, 58, -16);
    lock(ccx+44, 54, 14, 58,  16);
    dome(16, 52, 45, 54, 25);
    tie(ccx-44, 54); tie(ccx+44, 54);
  } else if(style === "ponytail"){
    lock(ccx+40, 54, 15, 65, 14);
    dome(16, 52, 45, 54, 25);
    tie(ccx+40, 54);
  } else if(style === "curly"){
    // ふわふわカール: 大小の円を重ねてボリュームを出す(あつもり風のもこもこ感)
    // 上段の房のみが共通ベース。目にかかる低い房は男の子は無し、女の子は耳の高さまで下げて配置
    const puffs = [
      [-40,20,17],[-20,10,19],[0,6,20],[20,10,19],[40,20,17]
    ];
    if(gender === "girl"){
      puffs.push([-42,48,12],[42,48,12]);
    }
    puffs.forEach(([dx,dy,r])=>{
      ctx.fillStyle = color; ctx.strokeStyle = outline;
      ctx.beginPath(); ctx.arc(ccx+dx, dy+22, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    });
    shineDab(ccx-14, 20, 12, 8, -0.3);
  }

  if(gender === "girl" && (style === "short" || style === "curly")){
    ctx.save();
    ctx.fillStyle = "#ff6b9d";
    ctx.strokeStyle = hairShade("#ff6b9d", -60);
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(ccx+30,26); ctx.lineTo(ccx+42,20); ctx.lineTo(ccx+42,32); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}

/* ============ キャラメイク画面 構築 ============ */
function miniCanvasFor(container, applyOpts){
  const c = document.createElement("canvas");
  c.width = 70; c.height = 86;
  const ctx = c.getContext("2d");
  const opts = Object.assign({}, state.char, applyOpts);
  drawCharacter(ctx, 70, 86, opts);
  return c;
}

function refreshCharPreview(){
  const ctx = document.getElementById("charCanvas").getContext("2d");
  drawCharacter(ctx, 180, 220, state.char);
}

function buildGenderRow(){
  const row = document.getElementById("row-gender");
  row.innerHTML = "";
  ["boy","girl"].forEach(g=>{
    const btn = document.createElement("button");
    btn.className = "opt-btn" + (state.char.gender===g ? " selected":"");
    const previewCloth = g==="girl" ? 3 : 0;
    const previewPants = g==="girl" ? 3 : 4;
    btn.appendChild(miniCanvasFor(row, {gender:g, hair:defaultHairForGender(g), cloth:previewCloth, pants:previewPants}));
    btn.onclick = ()=>{
      state.char.gender = g;
      state.char.hair = defaultHairForGender(g);
      state.char.cloth = previewCloth;
      state.char.pants = previewPants;
      buildGenderRow(); buildHairRow();
      buildSwatchRow("row-cloth", CLOTH_COLORS, "cloth");
      buildSwatchRow("row-pants", CLOTH_COLORS, "pants");
      refreshCharPreview();
    };
    row.appendChild(btn);
  });
}

function buildHairRow(){
  const row = document.getElementById("row-hair");
  row.innerHTML = "";
  hairStylesForGender(state.char.gender).forEach(h=>{
    const btn = document.createElement("button");
    btn.className = "opt-btn" + (state.char.hair===h ? " selected":"");
    btn.appendChild(miniCanvasFor(row, {hair:h}));
    btn.onclick = ()=>{ state.char.hair = h; buildHairRow(); refreshCharPreview(); };
    row.appendChild(btn);
  });
}

function buildSwatchRow(rowId, colors, stateKey){
  const row = document.getElementById(rowId);
  row.innerHTML = "";
  colors.forEach((c,i)=>{
    const btn = document.createElement("button");
    btn.className = "swatch" + (state.char[stateKey]===i ? " selected":"");
    btn.style.background = c;
    btn.onclick = ()=>{ state.char[stateKey] = i; buildSwatchRow(rowId,colors,stateKey); refreshCharPreview(); };
    row.appendChild(btn);
  });
}

function initCharScreen(){
  buildGenderRow();
  buildHairRow();
  buildSwatchRow("row-hairColor", HAIR_COLORS, "hairColor");
  buildSwatchRow("row-skin", SKIN_TONES, "skin");
  buildSwatchRow("row-cloth", CLOTH_COLORS, "cloth");
  buildSwatchRow("row-pants", CLOTH_COLORS, "pants");
  refreshCharPreview();
}

  state.name += ch;

  else buildAbcKeyboard();
}

/* ============ 名前入力: 音声入力(対応ブラウザのみ) ============
   iPhone SafariはWeb Speech API非対応のため、機能検出できた端末にのみボタンを表示する。
   音声はブラウザ標準の認識機能でテキスト化されるのみで、こちら側では録音データを保持しない。
*/
const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
let voiceListening = false;

function bcp47Lang(lang){
  return { ja:"ja-JP", en:"en-US", zh:"zh-CN", ko:"ko-KR", es:"es-ES", it:"it-IT", vi:"vi-VN", tl:"fil-PH" }[lang] || "en-US";
}

function updateVoiceButtonVisibility(){
  document.getElementById("btnVoice").style.display = SpeechRecognitionCtor ? "inline-block" : "none";
}

function startVoiceInput(){
  if(!SpeechRecognitionCtor || voiceListening) return;
  const recognizer = new SpeechRecognitionCtor();
  const btn = document.getElementById("btnVoice");
  recognizer.lang = bcp47Lang(state.lang);
  recognizer.interimResults = false;
  recognizer.maxAlternatives = 1;
  voiceListening = true;
  btn.classList.add("listening");
  btn.textContent = I18N[state.lang].voiceListening;
  recognizer.onresult = (e)=>{
    const transcript = e.results[0][0].transcript.trim().replace(/\s+/g,"");
    if(transcript) state.name = transcript.slice(0,6);
    renderName();
  };
  recognizer.onerror = ()=>{};
  recognizer.onend = ()=>{
    voiceListening = false;
    btn.classList.remove("listening");
    btn.textContent = I18N[state.lang].voiceBtn;
  };
  recognizer.start();
}

  state.lang = code;
  document.querySelectorAll("#langBar .lang-btn").forEach(b=>{
    b.classList.toggle("is-active", b.getAttribute("data-lang") === code);
  });

  updateVoiceButtonVisibility();
  // 名前入力中は、日本語=五十音表 / それ以外=ABC表 に組み替える。入力済みの名前は消す
  if(document.getElementById("screen-name").classList.contains("active")){
    state.name = "";
    renderName();
    buildKeyboardForLang();
  }
  if(document.getElementById("screen-zukan").classList.contains("active")) buildZukanGrid();
  if(document.getElementById("screen-map").classList.contains("active")) updateActionButtons();
}

});

document.getElementById("btnCharNext").addEventListener("click", ()=>{

/* ============ マップ(フェーズ5: 手描き店内図ベース) ============
   オーナーから受領した手描きの店内図(2026-08-15)を元にした本番マップ。
   ※2026-07-28受領の基本計画平面図では店内の構造を読み違えていたため、手描き図で全面的に作り直した。

   店の形は「上が細く下が広い」逆L字。列の役割は上から下までほぼ共通:
     ・左3列  : 左の通路(中〜下のみ。上は店の外)
     ・次の2列: 海。中央を縦に貫く
     ・次の4列: 上〜中は通路(北の突き当りから南へ一本道)、下はそのまま船(船上座敷席)になる
     ・右3列  : 上の大水槽(海)。**この列は上部にしか存在せず、右にはみ出す形**(オーナー指示)
   橋は中の海を東西に渡す。**左の通路と右側の通路をつなぐ唯一の道**なので、ここを壊すと左半分に行けなくなる。
   船は席だが特別に歩行可(オーナー判断)。船首は下向きにすぼまる。

   記号: '#'=壁・店外, '.'=通路, 'd'=船, 'b'=橋(どちらも歩行可), '~'=海(つる用),
         'e'=エビカゴ, 's'=貝カゴ(どちらものぞく用。カゴの種類で獲れるものが変わる)
   店舗改装等でレイアウトが変わった場合はこの MAP_ROWS_DATA を書き換えるだけでよい。
   ※変更したら必ず「左の通路から橋を渡って船まで行けるか」を確認すること(BFS到達性が壊れやすい)
*/
const MAP_ROWS_DATA = [
  // 上端の余白(プレイヤー画像が画面上端で欠けないためのバッファ)
  "############",
  "############",
  // ---- 上(北): 突き当りの通路 + その右にはみ出した大水槽 ----
  // カゴの位置はオーナーの手描き図(2026-08-16)どおり。大水槽は左端の列に貝カゴ(上)とエビカゴ(下)
  "#####....~~~",
  "#####....~~~",
  "#####....~~~",
  "#####....s~~",   // 貝カゴ(大水槽・上)
  "#####....~~~",
  "#####....~~~",
  "#####....~~~",
  "#####....e~~",   // エビカゴ(大水槽・下)
  "#####....~~~",
  "#####....~~~",
  "#####....###",   // 大水槽ここまで(右にはみ出しているのはここから上だけ)
  // ---- 中: 左の通路 / 海 / 通路 ----
  "...~~....###",
  "...~~....###",
  "...~~....###",
  "...~s....###",   // 貝カゴ(橋の手前・通路側)
  "...bb....###",   // 橋(左の通路 ⇔ 右の通路をつなぐ唯一の道)
  "...bb....###",
  "...bb....###",
  "...~~....###",
  // ---- 下(南): 左の通路 / 海 / 船(船上座敷席・歩行可) / 船の右側の海 ----
  // 船の右にも1列ぶん海を通してある。壁に接していると船が浮いて見えないため
  "...~edddd~##",   // エビカゴ(橋のすぐ下・船のとなり)
  "...~~dddd~##",
  "...~~dddd~##",
  "...~~dddd~##",
  "...~~dddd~##",
  "...~~dddd~##",
  "...~~dddd~##",
  "...~~dddd~##",   // 歩ける船はここまで(四角)。船首のとがりは drawBoat() が曲線で描く
  "...~~~~~~~##",   // 船首の曲線が乗る水面
  "...~~~~~~~##",
  "...~~~~~~~##"
];
const MAP_COLS = MAP_ROWS_DATA[0].length + 2, MAP_ROWS = MAP_ROWS_DATA.length, TILE = 24;
const VIEW_COLS = MAP_COLS;
/* 表示行数は端末の画面高さに合わせて決める(固定15行だと大きい端末で下半分が余り、
   小さい端末では下のボタンを押し出してしまうため)。
   reserve = 画面の上下余白 + マップ下の「ずかん/さいしょから」ボタンの高さ */
let VIEW_ROWS = 15;
function fitViewRows(){
  const reserve = 92 + 44;   // 92=画面余白+下のボタン, 44=上の言語バー
  const avail = Math.max(240, window.innerHeight - reserve);
  VIEW_ROWS = Math.max(12, Math.min(MAP_ROWS, Math.floor(avail / TILE)));
}
const T = { WALL:0, AISLE:1, WATER:2, DECK:3, KAGO_EBI:4, BRIDGE:5, KAGO_KAI:6 };
function walkable(t){ return t===T.AISLE || t===T.DECK || t===T.BRIDGE; }

let mapGrid = null;
let cameraY = 0;
const player = { r:0, c:0, px:0, py:0, path:[], moving:false };
let playerSprite = null;

function buildMapGrid(){
  const CH = { "#":T.WALL, ".":T.AISLE, "d":T.DECK, "~":T.WATER, "b":T.BRIDGE,
               "e":T.KAGO_EBI, "s":T.KAGO_KAI };
  mapGrid = MAP_ROWS_DATA.map(rowStr=>{
    const row = [T.WALL];
    for(const ch of rowStr) row.push(CH[ch]);
    row.push(T.WALL);
    return row;
  });
}

/* スタート地点 = 左下の通路の一番下(＝入口・レジ。オーナー確認済み 2026-08-16)。
   マップ最下段から上へ、各行は左から右へ探して最初に見つかった歩けるマスを使う。
   座標をハードコードしないので、マップを書き換えても入口が左下である限り自動で追従する */
function findStartTile(){
  for(let r=MAP_ROWS-1; r>=0; r--){
    for(let c=0; c<MAP_COLS; c++){
      if(walkable(mapGrid[r][c])) return [r, c];
    }
  }
  return [MAP_ROWS-1, Math.floor(MAP_COLS/2)];
}

function bfsPath(sr, sc, tr, tc){
  if(!walkable(mapGrid[tr][tc])) return null;
  const key = (r,c)=> r*MAP_COLS+c;
  const visited = new Set([key(sr,sc)]);
  const prev = new Map();
  const queue = [[sr,sc]];
  let head = 0;
  while(head < queue.length){
    const [r,c] = queue[head++];
    if(r===tr && c===tc) break;
    for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nr=r+dr, nc=c+dc;
      if(nr<0||nc<0||nr>=MAP_ROWS||nc>=MAP_COLS) continue;
      if(!walkable(mapGrid[nr][nc])) continue;
      const k = key(nr,nc);
      if(visited.has(k)) continue;
      visited.add(k);
      prev.set(k, [r,c]);
      queue.push([nr,nc]);
    }
  }
  if(!visited.has(key(tr,tc))) return null;
  const path = [];
  let cur = [tr,tc];
  while(cur[0]!==sr || cur[1]!==sc){
    path.push(cur);
    cur = prev.get(key(cur[0],cur[1]));
  }
  path.reverse();
  return path;
}

function nearestWalkable(r,c){
  if(r>=0 && c>=0 && r<MAP_ROWS && c<MAP_COLS && walkable(mapGrid[r][c])) return [r,c];
  let best=null, bestDist=Infinity;
  for(let rr=0; rr<MAP_ROWS; rr++){
    for(let cc=0; cc<MAP_COLS; cc++){
      if(!walkable(mapGrid[rr][cc])) continue;
      const dist = Math.abs(rr-r)+Math.abs(cc-c);
      if(dist < bestDist){ bestDist=dist; best=[rr,cc]; }
    }
  }
  return best;
}

function makePlayerSprite(){
  const c = document.createElement("canvas");
  c.width = 60; c.height = 74;
  drawCharacter(c.getContext("2d"), 60, 74, state.char);

}

const mapCanvas = document.getElementById("mapCanvas");
const mapCtx = mapCanvas.getContext("2d");

function drawTile(r,c){
  const t = mapGrid[r][c];
  const x = c*TILE, y = r*TILE;
  let fill = "#e4d3a8";
  if(t===T.WALL) fill = "#7a6a55";
  else if(t===T.AISLE) fill = "#e4d3a8";
  else if(t===T.WATER) fill = "#2f8fc4";
  else if(t===T.DECK) fill = "#2f8fc4";   // 船は水に浮いているので下地は水。船体は drawBoat() が描く
  else if(t===T.BRIDGE) fill = "#b07c3f";
  else if(t===T.KAGO_EBI || t===T.KAGO_KAI) fill = "#e4d3a8";
  mapCtx.fillStyle = fill;
  mapCtx.fillRect(x,y,TILE,TILE);

  if(t===T.WATER){
    mapCtx.strokeStyle = "rgba(255,255,255,.35)";
    mapCtx.lineWidth = 1.5;
    mapCtx.beginPath();
    mapCtx.moveTo(x+4, y+TILE/2);
    mapCtx.quadraticCurveTo(x+TILE/2, y+TILE/2-5, x+TILE-4, y+TILE/2);
    mapCtx.stroke();
  } else if(t===T.DECK){
    // 下地の水面(船体は drawBoat() が上から描く)
    mapCtx.strokeStyle = "rgba(255,255,255,.35)";
    mapCtx.lineWidth = 1.5;
    mapCtx.beginPath();
    mapCtx.moveTo(x+4, y+TILE/2);
    mapCtx.quadraticCurveTo(x+TILE/2, y+TILE/2-5, x+TILE-4, y+TILE/2);
    mapCtx.stroke();
  } else if(t===T.BRIDGE){
    // 橋: 渡る向き(東西)と直交する板目 + 南北の縁に手すり
    mapCtx.strokeStyle = "rgba(0,0,0,.16)";
    mapCtx.lineWidth = 1;
    mapCtx.beginPath();
    mapCtx.moveTo(x+TILE*0.33, y); mapCtx.lineTo(x+TILE*0.33, y+TILE);
    mapCtx.moveTo(x+TILE*0.66, y); mapCtx.lineTo(x+TILE*0.66, y+TILE);
    mapCtx.stroke();
    mapCtx.strokeStyle = "#7a5124";
    mapCtx.lineWidth = 3;
    mapCtx.beginPath();
    if(r>0 && mapGrid[r-1][c]!==T.BRIDGE){ mapCtx.moveTo(x, y+1.5); mapCtx.lineTo(x+TILE, y+1.5); }
    if(r<MAP_ROWS-1 && mapGrid[r+1][c]!==T.BRIDGE){ mapCtx.moveTo(x, y+TILE-1.5); mapCtx.lineTo(x+TILE, y+TILE-1.5); }
    mapCtx.stroke();
  } else if(t===T.WALL){
    mapCtx.strokeStyle = "rgba(0,0,0,.15)";
    mapCtx.lineWidth = 1;
    mapCtx.beginPath();
    mapCtx.moveTo(x, y+TILE); mapCtx.lineTo(x+TILE, y);
    mapCtx.stroke();
  } else if(t===T.KAGO_EBI || t===T.KAGO_KAI){
    // 生け簀のカゴ。何が入っているか一目で分かるよう、種類ごとに色と中の絵を変える
    const isEbi = (t === T.KAGO_EBI);
    const cx0 = x+TILE/2, cy0 = y+TILE/2;
    mapCtx.fillStyle = isEbi ? "#9c5f2e" : "#7d6a52";
    mapCtx.beginPath();
    mapCtx.ellipse(cx0, cy0, TILE*0.38, TILE*0.32, 0, 0, Math.PI*2);
    mapCtx.fill();
    mapCtx.strokeStyle = "#4f3316"; mapCtx.lineWidth = 1.5;
    mapCtx.stroke();
    // カゴの網目
    mapCtx.strokeStyle = "rgba(255,255,255,.30)"; mapCtx.lineWidth = 1;
    mapCtx.beginPath();
    mapCtx.moveTo(x+TILE*0.16, cy0-TILE*0.10); mapCtx.lineTo(x+TILE*0.84, cy0-TILE*0.10);
    mapCtx.moveTo(x+TILE*0.16, cy0+TILE*0.10); mapCtx.lineTo(x+TILE*0.84, cy0+TILE*0.10);
    mapCtx.stroke();
    // 中身の目印: エビカゴ=赤いエビ / 貝カゴ=渦巻きの貝
    if(isEbi){
      mapCtx.strokeStyle = "#e8543f"; mapCtx.lineWidth = 2.4; mapCtx.lineCap = "round";
      mapCtx.beginPath();
      mapCtx.arc(cx0, cy0+TILE*0.06, TILE*0.17, Math.PI*1.15, Math.PI*2.05);
      mapCtx.stroke();
      mapCtx.lineCap = "butt";
    } else {
      mapCtx.strokeStyle = "#f2e2c4"; mapCtx.lineWidth = 2;
      mapCtx.beginPath();
      for(let a=0; a<=Math.PI*3.2; a+=0.25){
        const rr = TILE*0.045 + a*TILE*0.032;
        const px = cx0 + Math.cos(a)*rr, py = cy0 + Math.sin(a)*rr;
        if(a===0) mapCtx.moveTo(px,py); else mapCtx.lineTo(px,py);
      }
      mapCtx.stroke();
    }
  }
}

/* ============ 船の描画 ============
   船をマスの集まり(四角い板)ではなく1隻の船として描く。
   DECKタイルの各行の左右端から輪郭の点列を作り、角を曲線でつないで滑らかな船体にする。
   船尾(上端)は通路と地続きなので直線のまま。船首(下端)だけ先端を伸ばしてとがらせる。
   マップの船の形を変えても、この関数はDECKタイルから輪郭を作り直すので追従する。 */
function boatRowSpans(){
  const rows = [];
  for(let r=0; r<MAP_ROWS; r++){
    let min=-1, max=-1;
    for(let c=0; c<MAP_COLS; c++) if(mapGrid[r][c]===T.DECK){ if(min<0) min=c; max=c; }
    if(min>=0) rows.push({r, min, max});
  }
  return rows;
}

/* 船の寸法をDECKタイルから求める。マップの船の位置や大きさを変えても追従する */
function boatGeometry(){
  const rows = boatRowSpans();
  if(rows.length === 0) return null;
  let minC = Infinity, maxC = -Infinity;
  for(const {min,max} of rows){ minC = Math.min(minC,min); maxC = Math.max(maxC,max); }
  const left = minC*TILE, right = (maxC+1)*TILE;
  const bowY = (rows[rows.length-1].r + 1) * TILE;
  return {
    minC, maxC, left, right, w: right-left, cx: (left+right)/2,
    sternR: rows[0].r,
    sternY: rows[0].r * TILE,
    bowY,                         // 歩ける船の下端。ここから下は描画だけの船首
    tipY: bowY + TILE*2.2         // 船首の先端
  };
}

/* 船体の輪郭。船尾(上)は通路と地続きなので直線、
   船首(下)は左右の舷から中心線上の1点へ向かうベジェ曲線でとがらせる。
   **左右を必ず中心線 cx で対称に描く**(マスの段差から輪郭を作ると先端が左右非対称になるため) */
function boatPath(g){
  const inset = TILE*0.5;   // ここから曲線に入る
  mapCtx.beginPath();
  mapCtx.moveTo(g.left, g.sternY);
  mapCtx.lineTo(g.left, g.bowY - inset);
  mapCtx.bezierCurveTo(g.left,               g.bowY + TILE*0.55,
                       g.cx - g.w*0.20,      g.tipY - TILE*0.40,
                       g.cx,                 g.tipY);
  mapCtx.bezierCurveTo(g.cx + g.w*0.20,      g.tipY - TILE*0.40,
                       g.right,              g.bowY + TILE*0.55,
                       g.right,              g.bowY - inset);
  mapCtx.lineTo(g.right, g.sternY);
  mapCtx.closePath();
}

function drawBoat(){
  const g = boatGeometry();
  if(!g) return;
  const rim = Math.max(4, TILE*0.30);   // ふなべりの幅

  mapCtx.save();
  // 船のまわりの喫水線(水のふくらみ)
  boatPath(g);
  mapCtx.strokeStyle = "rgba(255,255,255,.45)";
  mapCtx.lineWidth = 7;
  mapCtx.lineJoin = "round";
  mapCtx.stroke();

  // 船底(甲板)
  boatPath(g);
  const grad = mapCtx.createLinearGradient(g.left, 0, g.right, 0);
  grad.addColorStop(0,   "#b3844f");
  grad.addColorStop(0.5, "#d9ac74");
  grad.addColorStop(1,   "#b3844f");
  mapCtx.fillStyle = grad;
  mapCtx.fill();

  // ここから内側の描き込み。船体からはみ出さないよう切り抜く
  boatPath(g);
  mapCtx.clip();

  // 船の長さ方向に走る甲板の板目
  mapCtx.strokeStyle = "rgba(110,70,30,.28)";
  mapCtx.lineWidth = 1;
  mapCtx.beginPath();
  for(let c=g.minC+1; c<=g.maxC; c++){
    mapCtx.moveTo(c*TILE, g.sternY);
    mapCtx.lineTo(c*TILE, g.tipY);
  }
  mapCtx.stroke();

  // 腰掛け板(横に渡した板)。船の長さから枚数を決める
  const seatH = TILE*0.6, span = (g.bowY - g.sternY)/TILE;
  const seatCount = Math.min(5, Math.max(2, Math.round(span/3.5)));
  for(let i=1; i<=seatCount; i++){
    const sy = g.sternY + (g.bowY - g.sternY)*i/(seatCount+1) - seatH/2;
    mapCtx.fillStyle = "#e8c9a0";
    mapCtx.fillRect(g.left-rim, sy, g.w+rim*2, seatH);
    mapCtx.strokeStyle = "rgba(110,70,30,.45)";
    mapCtx.lineWidth = 1.5;
    mapCtx.strokeRect(g.left-rim, sy, g.w+rim*2, seatH);
  }

  // ふなべり(縁): 輪郭を内側にだけ太く塗って、ぐるりと一周する縁にする。
  // 先に濃い色を少し太く塗ることで、縁の内側に境界線が残る
  boatPath(g);
  mapCtx.strokeStyle = "#a8763f";
  mapCtx.lineWidth = rim*2 + 3;
  mapCtx.lineJoin = "round";
  mapCtx.stroke();
  boatPath(g);
  mapCtx.strokeStyle = "#e8c9a0";
  mapCtx.lineWidth = rim*2;
  mapCtx.stroke();
  mapCtx.restore();

  // 外周の輪郭線
  boatPath(g);
  mapCtx.strokeStyle = "#8b5a2b";
  mapCtx.lineWidth = 2;
  mapCtx.lineJoin = "round";
  mapCtx.stroke();
}

function drawMap(){
  mapCanvas.width = VIEW_COLS*TILE;
  mapCanvas.height = VIEW_ROWS*TILE;
  const viewH = VIEW_ROWS*TILE, mapH = MAP_ROWS*TILE;
  cameraY = Math.max(0, Math.min(player.py - viewH/2, mapH - viewH));
  mapCtx.save();
  mapCtx.translate(0, -cameraY);
  const rStart = Math.max(0, Math.floor(cameraY/TILE)-1);
  const rEnd = Math.min(MAP_ROWS-1, Math.ceil((cameraY+viewH)/TILE)+1);
  for(let r=rStart;r<=rEnd;r++) for(let c=0;c<MAP_COLS;c++) drawTile(r,c);
  drawBoat();
  drawPlayer();
  mapCtx.restore();
}

function tileCenter(r,c){ return [c*TILE+TILE/2, r*TILE+TILE/2]; }

function updateActionButtons(){
  const r = player.r, c = player.c;
  let nearWater=false, nearKago=false;
  for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const nr=r+dr, nc=c+dc;
    if(nr<0||nc<0||nr>=MAP_ROWS||nc>=MAP_COLS) continue;
    const t = mapGrid[nr][nc];
    if(t===T.WATER) nearWater=true;
    // 隣のカゴの種類を覚えておく(のぞいたときの抽選表がカゴごとに違うため)
    if(t===T.KAGO_EBI){ nearKago=true; state.kagoType = "ebi"; }
    if(t===T.KAGO_KAI){ nearKago=true; state.kagoType = "kai"; }
  }
  document.getElementById("btnFish").classList.toggle("show", nearWater);
  document.getElementById("btnPeek").classList.toggle("show", nearKago);
}

let animReq = null;
function stepAlongPath(){
  if(player.path.length === 0){
    player.moving = false;
    updateActionButtons();
    return;
  }
  player.moving = true;
  const [nr,nc] = player.path.shift();
  const [fx,fy] = tileCenter(player.r, player.c);
  const [tx,ty] = tileCenter(nr, nc);
  const duration = 200;
  const start = performance.now();
  function frame(now){
    const t = Math.min(1, (now-start)/duration);
    player.px = fx + (tx-fx)*t;
    player.py = fy + (ty-fy)*t;
    drawMap();
    if(t < 1){
      animReq = requestAnimationFrame(frame);
    } else {
      player.r = nr; player.c = nc;
      stepAlongPath();
    }
  }
  animReq = requestAnimationFrame(frame);
}

function movePlayerTo(r,c){
  if(player.moving) return;
  const target = nearestWalkable(r,c);
  if(!target) return;
  const path = bfsPath(player.r, player.c, target[0], target[1]);
  if(!path || path.length===0) return;
  player.path = path;
  stepAlongPath();
}

mapCanvas.addEventListener("click", (e)=>{
  const rect = mapCanvas.getBoundingClientRect();
  const scaleX = mapCanvas.width / rect.width;
  const scaleY = mapCanvas.height / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY + cameraY;
  const c = Math.floor(x/TILE), r = Math.floor(y/TILE);
  if(r<0||c<0||r>=MAP_ROWS||c>=MAP_COLS) return;
  movePlayerTo(r,c);
});

function buildZukanGrid(){
  const grid = document.getElementById("zukanGrid");
  grid.innerHTML = "";
  const dict = I18N[state.lang];
  COLLECTION_ORDER.forEach(key=>{
    const owned = !!state.collected[key];
    const cell = document.createElement("div");
    cell.className = "zukan-cell" + (owned ? " owned" : "");
    const c = document.createElement("canvas");
    // 画面の細かさ(DPR)ぶん大きく描いてから72pxに縮めて表示する。イラストの細い線がぼやけないように
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    c.width = 72*dpr; c.height = 72*dpr;
    c.style.width = "72px"; c.style.height = "72px";
    const cctx = c.getContext("2d");
    cctx.scale(dpr, dpr);
    drawSpeciesIcon(cctx, 72, 72, key, !owned);
    cell.appendChild(c);
    if(owned){
      // 獲った数(数字と×だけなので言語に依存しない)
      const count = document.createElement("div");
      count.className = "zukan-count";
      count.textContent = "×" + state.collected[key];
      cell.appendChild(count);
    }
    const label = document.createElement("div");
    label.className = "zukan-label";
    label.textContent = owned ? FISH_NAMES[key][state.lang] : "？？？";
    cell.appendChild(label);
    grid.appendChild(cell);
  });
  const allCaught = COLLECTION_ORDER.every(k=>state.collected[k]);
  const badge = document.getElementById("zukanComplete");
  if(allCaught){
    badge.style.display = "block";
    badge.textContent = dict.completeMsg;
    if(!state.completeShown){ state.completeShown = true; launchConfetti(); }
  } else {
    badge.style.display = "none";
  }
}

function launchConfetti(){
  const colors = ["#ff9f43","#ff5c7a","#2e86de","#10ac84","#ffd54f"];
  for(let i=0;i<40;i++){
    const el = document.createElement("div");
    el.className = "confetti";
    el.style.left = Math.random()*100 + "vw";
    el.style.background = colors[i % colors.length];
    el.style.animationDuration = (2.2 + Math.random()*1.4) + "s";
    el.style.animationDelay = (Math.random()*0.6) + "s";
    document.body.appendChild(el);
    setTimeout(()=> el.remove(), 4500);
  }
}
