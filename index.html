/* ============ フェーズ3: 釣りミニゲーム ============ */
const fishCanvas = document.getElementById("fishCanvas");
const fishCtx = fishCanvas.getContext("2d");
const FISH_BITE_WINDOW = 900;
const REEL_START_GAUGE = 10;
/* 巻きはじめの猶予。開始が10%と低いので、指を円に置くまでの一瞬で
   ゲージが0になって即失敗する事故を防ぐため、最初のこの時間だけ魚は引かない。
   引きを強くした(FISH_FIGHT の base を上げた)ぶん、指を置くまでの余裕も 1.2→1.8秒に延ばしてある */
const REEL_GRACE_MS = 1800;
/* 手が止まっている間は、さらにこの倍率でゲージが下がる(オーナー指示 2026-08-16)。
   「回していないとみるみる減る」手ごたえを出すのが目的。
   巻いている限りは倍率がかからないので、ゆっくり巻く子が損をすることはない。
   最初の1回転を始めるまでは適用しない(始める前に落ちきってしまうのを防ぐため) */
const REEL_IDLE_MS   = 500;   /* 指を置き直す一瞬で罰を受けないよう、少し余裕を持たせている */
const REEL_IDLE_MULT = 1.8;
const REEL_TIMEOUT = 90000;   /* 巻く回数を増やしたぶん延ばす。base<gain なので巻き続けている限り
                                 ゲージは前に進む。時間切れは「手が止まった子」への区切りという位置づけで、
                                 ゆっくり巻いた実測(最長シマアジ約50秒)に対して十分な余裕を取ってある */
/* base: 引きの平均の強さ(ゲージ減少/秒)。amp: 波の振れ幅(base±ampで強弱)。
   period: 一往復にかかる秒数(短いほど強弱の切り替えが速い)。
   レア度が上がるほどamp・periodを強くし、「強く引かれてゲージが減る」「一瞬ゆるんでゲージが戻る」の
   振れ幅を大きくして駆け引きを難しくする。amp>=baseの魚は一瞬マイナス減衰(=ゲージが自然回復)になる瞬間がある */
/* gain は「リールを1回転させたときに増えるゲージ量」。
   連打式だった頃は1タップぶんの値で、1秒に何回も入力できる前提の数字だった。
   リール式は入力の速さが指の回転(1秒に1〜2回転)に制限されるため、
   オーナー指示「巻く回数をグンと増やす」に合わせて base(引きの強さ)ごと組み直してある。

   2026-08-16 オーナー指示「回さないときに下がるスピードをもっと早く」で base を 1.4〜2.75倍に上げた。
   ただし base だけ上げると必要な回転数まで増えてしまうので、gain も同じだけ上げて
   **1回転あたりの正味の進み(gain - base)は据え置き**にしてある。
   実測の目安(10%→100%まで、1回転/秒): アジ16.4 / カサゴ19.6 / タイ・ヒラメ23.7 / シマアジ31回転(変更前と同じ)。

   base / gain の比 = 「これより遅く巻くと前に進めなくなる回転速度」。
   全魚とも 0.50〜0.55 に収めてあり、1秒に半回転でも必ず前に進む。
   **この比を 0.6 より上げないこと**。ゆっくり巻く小さい子が永久に釣れなくなる(過去にやらかした) */
const FISH_FIGHT = {
  aji:      { gain:11.0, base:5.5, amp:0,   period:1.0 },
  kasago:   { gain:9.6,  base:5.0, amp:3.8, period:1.6 },
  tai:      { gain:8.2,  base:4.4, amp:5.4, period:1.3 },
  hirame:   { gain:8.2,  base:4.4, amp:5.4, period:1.1 },
  shimaaji: { gain:6.5,  base:3.6, amp:5.8, period:0.9 }
};
/* レア度が高いほど跳ねる演出を派手にする(ジャンプの高さ・キラキラの数) */
const FISH_RARITY = { aji:1, kasago:2, tai:3, hirame:3, shimaaji:4 };
let fishAnim = null;
let fishState = "idle";
let fishWaitStart = 0, fishWaitDuration = 0, fishBiteStart = 0;
let fishGauge = 0, fishPendingKey = null, fishLastFrameTime = 0, fishReelStart = 0, fishReelPhase = 0;
let fishHitStart = 0;                 // 「ヒット！」を見せている間
const HIT_SHOW_MS = 800;
/* リール(指でぐるぐるなぞる)の状態。
   reelAngle   … 巻き取った量の合計(ラジアン)。見た目の回転にも使う
   reelLastAng … 直前に指があった角度。差分の絶対値を巻き取り量として足す
   1回転(2π)で fight.gain ぶんゲージが増える */
const ROT_GAIN_MULT = 1;   // gain がそのまま「1回転ぶん」
let reelDragging = false, reelLastAng = 0, reelAngle = 0, reelSpin = 0;
/* reelLastInputMs … 最後に指を動かした時刻。ここから REEL_IDLE_MS 以上あくと「手が止まった」扱い
   reelStarted    … 一度でも巻いたか。巻き始める前は止まった扱いにしない */
let reelLastInputMs = 0, reelStarted = false;

function drawFishScene(bobY, showExclaim){
  const w = fishCanvas.width, h = fishCanvas.height;
  fishCtx.clearRect(0,0,w,h);
  const grad = fishCtx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,"#8fd0f0"); grad.addColorStop(1,"#0f4c75");
  fishCtx.fillStyle = grad; fishCtx.fillRect(0,0,w,h);
  fishCtx.strokeStyle = "rgba(255,255,255,.25)"; fishCtx.lineWidth = 2;
  for(let i=0;i<4;i++){
    const y = h*0.2 + i*h*0.18;
    fishCtx.beginPath();
    for(let x=0;x<=w;x+=10){
      const yy = y + Math.sin((x/28) + (performance.now()/700) + i)*4;
      if(x===0) fishCtx.moveTo(x,yy); else fishCtx.lineTo(x,yy);
    }
    fishCtx.stroke();
  }
  const lineX = w/2;
  fishCtx.strokeStyle = "rgba(255,255,255,.7)"; fishCtx.lineWidth = 1.5;
  fishCtx.beginPath(); fishCtx.moveTo(lineX,0); fishCtx.lineTo(lineX,bobY); fishCtx.stroke();
  fishCtx.beginPath(); fishCtx.arc(lineX,bobY,10,0,Math.PI*2);
  fishCtx.fillStyle = "#fff"; fishCtx.fill();
  fishCtx.beginPath(); fishCtx.arc(lineX,bobY-4,10,Math.PI,0);
  fishCtx.fillStyle = "#ff4444"; fishCtx.fill();
  if(showExclaim){
    fishCtx.fillStyle = "#fff176"; fishCtx.font = "bold 34px sans-serif"; fishCtx.textAlign = "center";
    fishCtx.fillText("！", lineX+30, bobY-14);
  }
}

/* 掛かった瞬間の「ヒット！」。文字だけだと気づきにくいので、
   ウキのまわりに広がる波紋と一緒に大きく出す */
function drawHitScene(t){
  const w = fishCanvas.width, h = fishCanvas.height;
  drawFishScene(140, false);
  const cx = w/2, cy = 140;
  fishCtx.strokeStyle = "rgba(255,255,255," + Math.max(0, 1-t) + ")";
  fishCtx.lineWidth = 3;
  for(let i=0;i<3;i++){
    const rad = (t + i*0.3) * 90;
    if(rad <= 0 || rad > 130) continue;
    fishCtx.beginPath();
    fishCtx.ellipse(cx, cy, rad, rad*0.4, 0, 0, Math.PI*2);
    fishCtx.stroke();
  }
  const pop = t < 0.25 ? t/0.25 : 1;
  const scale = 0.6 + 0.55*Math.min(1, pop*1.25) - (t>0.8 ? (t-0.8)*0.3 : 0);
  fishCtx.save();
  fishCtx.translate(cx, h*0.34);
  fishCtx.scale(scale, scale);
  fishCtx.textAlign = "center"; fishCtx.textBaseline = "middle";
  fishCtx.font = "bold 46px sans-serif";
  fishCtx.lineWidth = 8; fishCtx.strokeStyle = "#c23458";
  fishCtx.strokeText(I18N[state.lang].hitMsg, 0, 0);
  fishCtx.fillStyle = "#fff176";
  fishCtx.fillText(I18N[state.lang].hitMsg, 0, 0);
  fishCtx.restore();
}

/* 引き寄せ中の海。オーナー指示で「ヒット後も海の背景を消さない」ため、
   円と並べて描き続ける。魚が強く引いている(intensity)ほどシルエットが揺れ、糸が張る */
function drawFightScene(intensity){
  const w = fishCanvas.width, h = fishCanvas.height;
  drawFishScene(h*0.62, false);
  if(!fishPendingKey) return;
  const jx = (Math.random()-0.5)*intensity*16;
  const jy = (Math.random()-0.5)*intensity*16;
  const size = w*0.34;
  fishCtx.save();
  fishCtx.translate(w/2 - size/2 + jx, h*0.36 - size/2 + jy);
  drawSpeciesGraphic(fishCtx, size, size, fishPendingKey, true);
  fishCtx.restore();
}

function currentDecayRate(fight, elapsedSec){
  return fight.base + fight.amp * Math.sin((Math.PI*2*elapsedSec/fight.period) + fishReelPhase);
}

function drawStar(ctx, cx, cy, r, rotation, alpha){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation);
  ctx.beginPath();
  for(let i=0;i<5;i++){
    const outerA = -Math.PI/2 + i*(Math.PI*2/5);
    const innerA = outerA + Math.PI/5;
    const ox = Math.cos(outerA)*r, oy = Math.sin(outerA)*r;
    const ix = Math.cos(innerA)*r*0.45, iy = Math.sin(innerA)*r*0.45;
    if(i===0) ctx.moveTo(ox,oy); else ctx.lineTo(ox,oy);
    ctx.lineTo(ix,iy);
  }
  ctx.closePath();
  ctx.fillStyle = `rgba(255,213,79,${alpha})`;
  ctx.fill();
  ctx.restore();
}

/* 釣り上げ演出: 魚が水面から跳ねて、色付きの姿で見得を切る。レア度が高いほど跳躍・キラキラが派手になる */
function playCatchReveal(key, onDone){
  const w = fishCanvas.width, h = fishCanvas.height;
  const rarity = FISH_RARITY[key] || 1;
  const duration = 1300;
  const jumpPhase = 0.42;
  const waterY = h*0.72, centerX = w/2;
  const jumpHeight = 55 + rarity*16;
  const start = performance.now();

  const drops = [];
  const numDrops = 6 + rarity*3;
  for(let i=0;i<numDrops;i++){
    drops.push({
      vx: (Math.random()-0.5)*160,
      vy: -(90+Math.random()*90),
      delay: Math.random()*0.08
    });
  }
  const sparkles = [];
  const numSparkles = rarity + 2;
  for(let i=0;i<numSparkles;i++){
    sparkles.push({
      angle: (i/numSparkles)*Math.PI*2 + Math.random()*0.5,
      r: 38 + Math.random()*22,
      spin: Math.random()*Math.PI,
      delay: Math.random()*0.25
    });
  }

  if(rarity >= 4) goldFlash();

  function frame(now){
    const t = Math.min(1, (now-start)/duration);
    fishCtx.clearRect(0,0,w,h);
    const grad = fishCtx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0,"#8fd0f0"); grad.addColorStop(1,"#0f4c75");
    fishCtx.fillStyle = grad; fishCtx.fillRect(0,0,w,h);
    fishCtx.fillStyle = "rgba(255,255,255,.12)";
    fishCtx.fillRect(0, waterY, w, h-waterY);

    if(t < jumpPhase){
      const ringT = t/jumpPhase;
      fishCtx.strokeStyle = `rgba(255,255,255,${1-ringT})`;
      fishCtx.lineWidth = 3;
      for(let r=0;r<2;r++){
        const rad = (ringT+r*0.35) * (26+rarity*6);
        if(rad <= 0) continue;
        fishCtx.beginPath();
        fishCtx.ellipse(centerX, waterY, rad, rad*0.35, 0, 0, Math.PI*2);
        fishCtx.stroke();
      }
    }

    const tSec = t*duration/1000;
    drops.forEach(d=>{
      const dt = Math.max(0, tSec-d.delay);
      if(dt<=0 || dt>0.9) return;
      const x = centerX + d.vx*dt;
      const y = waterY + d.vy*dt + 260*dt*dt;
      if(y > waterY) return;
      fishCtx.fillStyle = `rgba(255,255,255,${Math.max(0,1-dt/0.9)})`;
      fishCtx.beginPath(); fishCtx.arc(x,y,2.5,0,Math.PI*2); fishCtx.fill();
    });

    let fishY, fishScale, fishRot;
    if(t < jumpPhase){
      const t2 = t/jumpPhase;
      fishY = waterY - jumpHeight*Math.sin(t2*Math.PI/2);
      fishScale = 0.6 + 0.7*t2;
      fishRot = Math.sin(t2*Math.PI*3)*0.35*(1-t2);
    } else {
      const t3 = (t-jumpPhase)/(1-jumpPhase);
      fishY = (waterY - jumpHeight) - Math.sin(t3*Math.PI)*4;
      fishScale = 1.3 + Math.sin(t3*Math.PI*2)*0.03;
      fishRot = Math.sin(t3*Math.PI*4)*0.04;
    }
    fishCtx.save();
    fishCtx.translate(centerX, fishY);
    fishCtx.rotate(fishRot);
    const size = 100*fishScale;
    fishCtx.translate(-size/2, -size/2);
    drawSpeciesGraphic(fishCtx, size, size, key, false);
    fishCtx.restore();

    if(t >= jumpPhase){
      const t3 = (t-jumpPhase)/(1-jumpPhase);
      sparkles.forEach(s=>{
        const sT = Math.max(0, Math.min(1, (t3 - s.delay)/(1-s.delay)));
        if(sT<=0) return;
        const alpha = sT < 0.7 ? sT/0.7 : Math.max(0,1-(sT-0.7)/0.3);
        const rad = s.r * (0.4+0.6*sT);
        const sx = centerX + Math.cos(s.angle)*rad;
        const sy = fishY + Math.sin(s.angle)*rad*0.7;
        drawStar(fishCtx, sx, sy, 7, s.spin+sT*2, alpha);
      });
    }

    if(t < 1){
      fishAnim = requestAnimationFrame(frame);
    } else {
      onDone();
    }
  }
  fishAnim = requestAnimationFrame(frame);
}

/* リールの円。指でなぞる輪・回るハンドル・回す向きの矢印を描く。
   intensity(魚が強く引いている度合い)が高いと赤くなり、輪が震える */
const reelDial = document.getElementById("reelDial");
const reelCtx = reelDial.getContext("2d");

/* 円の大きさを決める。
   海の絵と下の「もどる」を残したうえで、余っている高さと画面幅の小さいほうまで大きくする。
   端末ごとに使える高さが違うのでCSSの固定値ではなく、毎回その場で測って決める。
   ※先に0pxにしてから測るのは、前回の大きさに引きずられて縮まなくなるのを防ぐため */
function layoutReel(){
  const back = document.getElementById("btnFishCancel");
  const area = document.getElementById("reelArea");
  reelDial.style.width = "0px"; reelDial.style.height = "0px";
  const areaTop = area.getBoundingClientRect().top;
  const limitY  = back.getBoundingClientRect().top;
  const byHeight = limitY - areaTop - 12;
  const byWidth  = document.getElementById("screen-fish").clientWidth - 24;
  const size = Math.max(150, Math.min(330, Math.min(byHeight, byWidth)));
  reelDial.style.width = size + "px";
  reelDial.style.height = size + "px";
  // 大きくしたときにボケないよう、描画解像度は表示サイズ×画面の倍率にそろえる
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const px = Math.round(size * dpr);
  if(reelDial.width !== px){ reelDial.width = px; reelDial.height = px; }
}

/* リールの円。巻いている間はこれが主役になるので、輪の中に魚の姿とゲージもまとめて描く。
   ・輪   … 指でなぞるところ。巻いた量ぶん色が伸びてゲージも兼ねる
   ・玉   … 指で追いかけるハンドル
   ・中央 … 掛かっている魚のシルエット(引きが強いほど揺れる)
   intensity(魚が強く引いている度合い)が高いと赤くなり、輪が震える */
function drawReelDial(intensity, gauge){
  const w = reelDial.width, h = reelDial.height;
  const cx = w/2, cy = h/2, R = w*0.37, track = w*0.09;
  reelCtx.clearRect(0,0,w,h);

  const shake = intensity*w*0.012;
  reelCtx.save();
  reelCtx.translate(cx + (Math.random()-0.5)*shake, cy + (Math.random()-0.5)*shake);

  // 輪の下地
  reelCtx.strokeStyle = "rgba(255,255,255,.55)";
  reelCtx.lineWidth = track;
  reelCtx.lineCap = "butt";
  reelCtx.beginPath(); reelCtx.arc(0,0,R,0,Math.PI*2); reelCtx.stroke();

  // 巻いた量(ゲージ)。上から時計回りに伸びる
  const pct = Math.max(0, Math.min(100, gauge))/100;
  if(pct > 0){
    reelCtx.strokeStyle = intensity > 0.55 ? "#ff5c5c" : "#ff9f43";
    reelCtx.lineWidth = track;
    reelCtx.lineCap = "round";
    reelCtx.beginPath();
    reelCtx.arc(0,0,R, -Math.PI/2, -Math.PI/2 + Math.PI*2*pct);
    reelCtx.stroke();
    reelCtx.lineCap = "butt";
  }
  reelCtx.strokeStyle = "rgba(0,0,0,.12)";
  reelCtx.lineWidth = 2;
  reelCtx.beginPath(); reelCtx.arc(0,0,R+track/2,0,Math.PI*2); reelCtx.stroke();
  reelCtx.beginPath(); reelCtx.arc(0,0,R-track/2,0,Math.PI*2); reelCtx.stroke();

  // 回した量が分かるよう、輪の内側の刻みを一緒に回す
  reelCtx.save();
  reelCtx.rotate(reelAngle);
  reelCtx.strokeStyle = "rgba(30,111,168,.45)";
  reelCtx.lineWidth = w*0.012;
  for(let i=0;i<16;i++){
    const a = i*Math.PI/8;
    reelCtx.beginPath();
    reelCtx.moveTo(Math.cos(a)*(R-track*0.72), Math.sin(a)*(R-track*0.72));
    reelCtx.lineTo(Math.cos(a)*(R-track*0.15), Math.sin(a)*(R-track*0.15));
    reelCtx.stroke();
  }
  reelCtx.restore();

  // 中央: 巻き上がり具合の数字。魚のシルエットは上の海の絵が受け持つ
  reelCtx.textAlign = "center"; reelCtx.textBaseline = "middle";
  reelCtx.fillStyle = intensity > 0.55 ? "#ff5c5c" : "rgba(255,255,255,.95)";
  reelCtx.font = "bold " + Math.round(w*0.16) + "px sans-serif";
  reelCtx.fillText(Math.round(gauge) + "%", 0, 0);

  // ハンドル(指で追いかける玉)
  const hx = Math.cos(reelSpin)*R, hy = Math.sin(reelSpin)*R;
  reelCtx.fillStyle = "#ff9f43";
  reelCtx.beginPath(); reelCtx.arc(hx,hy,track*0.62,0,Math.PI*2); reelCtx.fill();
  reelCtx.strokeStyle = "#fff"; reelCtx.lineWidth = w*0.012;
  reelCtx.beginPath(); reelCtx.arc(hx,hy,track*0.62,0,Math.PI*2); reelCtx.stroke();

  // まわす向きの矢印(指を置いていない間だけ点滅させて誘導する)
  if(!reelDragging){
    const blink = 0.35 + 0.35*Math.sin(performance.now()/260);
    reelCtx.strokeStyle = "rgba(255,255,255," + blink + ")";
    reelCtx.lineWidth = w*0.016;
    const AR = R*1.22, head = w*0.035;
    for(let k=0;k<2;k++){
      const a0 = k*Math.PI + 0.35, a1 = a0 + 0.9;
      reelCtx.beginPath(); reelCtx.arc(0,0,AR,a0,a1); reelCtx.stroke();
      const ax = Math.cos(a1)*AR, ay = Math.sin(a1)*AR;
      reelCtx.beginPath();
      reelCtx.moveTo(ax,ay);
      reelCtx.lineTo(ax - Math.cos(a1-0.6)*head, ay - Math.sin(a1-0.6)*head);
      reelCtx.moveTo(ax,ay);
      reelCtx.lineTo(ax - Math.cos(a1+0.35)*head, ay - Math.sin(a1+0.35)*head);
      reelCtx.stroke();
    }
  }
  reelCtx.restore();
}

/* 指の位置から円の中心まわりの角度を求める */
function reelAngleAt(ev){
  const r = reelDial.getBoundingClientRect();
  return Math.atan2(ev.clientY - (r.top + r.height/2), ev.clientX - (r.left + r.width/2));
}

reelDial.addEventListener("pointerdown", (ev)=>{
  if(fishState !== "reeling") return;
  ev.preventDefault();
  reelDragging = true;
  reelLastAng = reelAngleAt(ev);
  reelLastInputMs = performance.now();
  reelDial.setPointerCapture(ev.pointerId);
});
reelDial.addEventListener("pointermove", (ev)=>{
  if(!reelDragging || fishState !== "reeling") return;
  ev.preventDefault();
  const a = reelAngleAt(ev);
  // -π〜πをまたぐので、差は必ず近いほうを取る
  let d = a - reelLastAng;
  while(d > Math.PI) d -= Math.PI*2;
  while(d < -Math.PI) d += Math.PI*2;
  reelLastAng = a;
  reelSpin = a;
  reelAngle += d;
  // 実際に回した時だけ「動いている」とみなす(指を置いたまま止めていたら止まった扱い)
  if(Math.abs(d) > 0.01){ reelLastInputMs = performance.now(); reelStarted = true; }
  // 巻く向きはどちらでもよい(子供が迷わないように)。回した量ぶんゲージが増える
  const fight = FISH_FIGHT[fishPendingKey];
  fishGauge = Math.min(100, fishGauge + (Math.abs(d)/(Math.PI*2)) * fight.gain * ROT_GAIN_MULT);
  if(fishGauge >= 100) endFishing(true);
});
function reelRelease(ev){
  if(!reelDragging) return;
  reelDragging = false;
  try{ reelDial.releasePointerCapture(ev.pointerId); }catch(e){}
}
reelDial.addEventListener("pointerup", reelRelease);
reelDial.addEventListener("pointercancel", reelRelease);

function beginHit(){
  fishState = "hit";
  fishHitStart = performance.now();
  fishPendingKey = weightedPick(FISH_TABLE);
  const msgEl = document.getElementById("fishMsg");
  msgEl.textContent = I18N[state.lang].hitMsg;
  msgEl.classList.add("urgent");
}

function beginReeling(){
  fishState = "reeling";
  // 魚の種類は掛かった瞬間(beginHit)にすでに決まっている
  fishGauge = REEL_START_GAUGE;
  fishReelStart = performance.now();
  fishLastFrameTime = fishReelStart;
  fishReelPhase = Math.random()*Math.PI*2;
  reelAngle = 0; reelSpin = -Math.PI/2; reelDragging = false;
  reelStarted = false; reelLastInputMs = fishReelStart;
  document.getElementById("screen-fish").classList.add("reeling");
  document.getElementById("reelArea").classList.add("show");
  layoutReel();
  const msgEl = document.getElementById("fishMsg");
  msgEl.textContent = I18N[state.lang].reelMsg;
  msgEl.classList.add("urgent");
}

function fishLoop(now){
  if(fishState === "waiting"){
    const elapsed = now - fishWaitStart;
    const bobY = 90 + Math.sin(now/260)*6;
    drawFishScene(bobY, false);
    if(elapsed >= fishWaitDuration){
      fishState = "bite";
      fishBiteStart = now;
      const msgEl = document.getElementById("fishMsg");
      msgEl.textContent = I18N[state.lang].fishNowMsg;
      msgEl.classList.add("urgent");
    }
    fishAnim = requestAnimationFrame(fishLoop);
  } else if(fishState === "bite"){
    drawFishScene(130, true);
    if(now - fishBiteStart > FISH_BITE_WINDOW){
      endFishing(false, "late");
      return;
    }
    fishAnim = requestAnimationFrame(fishLoop);
  } else if(fishState === "hit"){
    const t = (now - fishHitStart) / HIT_SHOW_MS;
    drawHitScene(Math.min(1, t));
    if(t >= 1){ beginReeling(); }
    fishAnim = requestAnimationFrame(fishLoop);
  } else if(fishState === "reeling"){
    const dt = (now - fishLastFrameTime) / 1000;
    fishLastFrameTime = now;
    const fight = FISH_FIGHT[fishPendingKey];
    const elapsedSec = (now - fishReelStart) / 1000;
    // 巻きはじめの猶予中は魚が引かない(指を円に置く時間を作る)
    let rate = (now - fishReelStart < REEL_GRACE_MS) ? 0 : currentDecayRate(fight, elapsedSec);
    // 手が止まっている間はさらに速く下がる(巻いている間は倍率をかけない)
    const idle = reelStarted && rate > 0 && (now - reelLastInputMs > REEL_IDLE_MS);
    if(idle) rate *= REEL_IDLE_MULT;
    let intensity = fight.amp > 0 ? Math.max(0, Math.min(1, (rate - (fight.base-fight.amp)) / (fight.amp*2))) : 0;
    // 止まっているあいだはゲージを赤くして「回して！」と伝える(アジは amp:0 なので明示的に上げる)
    if(idle) intensity = Math.max(intensity, 0.85);
    fishGauge = Math.max(0, Math.min(100, fishGauge - rate*dt));
    drawFightScene(intensity);
    drawReelDial(intensity, fishGauge);
    if(fishGauge >= 100){ endFishing(true); return; }
    if(fishGauge <= 0 || now - fishReelStart > REEL_TIMEOUT){ endFishing(false, "struggle"); return; }
    fishAnim = requestAnimationFrame(fishLoop);
  }
}

function startFishing(){
  fishState = "waiting";
  fishWaitStart = performance.now();
  fishWaitDuration = 2000 + Math.random()*4000;
  fishGauge = 0;
  fishPendingKey = null;
  const msgEl = document.getElementById("fishMsg");
  msgEl.textContent = I18N[state.lang].fishWaitMsg;
  msgEl.classList.remove("urgent");
  document.getElementById("fishResultActions").style.display = "none";
  document.getElementById("btnFishCancel").style.display = "inline-block";
  document.getElementById("reelArea").classList.remove("show");
  document.getElementById("screen-fish").classList.remove("reeling");
  if(fishAnim) cancelAnimationFrame(fishAnim);
  fishAnim = requestAnimationFrame(fishLoop);
}

function endFishing(success, reason){
  if(fishAnim) cancelAnimationFrame(fishAnim);
  fishState = "idle";
  reelDragging = false;
  document.getElementById("reelArea").classList.remove("show");
  document.getElementById("screen-fish").classList.remove("reeling");
  const dict = I18N[state.lang];
  const msgEl = document.getElementById("fishMsg");
  msgEl.classList.remove("urgent");
  document.getElementById("btnFishCancel").style.display = "none";
  if(success){
    const key = fishPendingKey;
    state.collected[key] = (state.collected[key] || 0) + 1;
    msgEl.textContent = "";
    document.getElementById("fishResultActions").style.display = "none";
    playCatchReveal(key, ()=>{
      msgEl.textContent = dict.gotItemTemplate.replace("{name}", FISH_NAMES[key][state.lang]);
      document.getElementById("fishResultActions").style.display = "flex";
    });
  } else {
    document.getElementById("fishResultActions").style.display = "flex";
    if(reason === "early"){
      msgEl.textContent = dict.fishFailEarlyMsg;
    } else if(reason === "struggle"){
      msgEl.textContent = dict.fishFailStruggleMsg;
    } else {
      msgEl.textContent = dict.fishFailLateMsg;
    }
  }
}

/* あたりが来たら画面のどこをタップしてもヒットにする(ウキを狙わせない)。
   引き寄せはリールの円をなぞる操作なので、ここでは扱わない。
   下部のボタンとリールの上でのタップは、それぞれの操作を邪魔しないよう除外する */
document.getElementById("screen-fish").addEventListener("pointerdown", (ev)=>{
  if(ev.target.closest("button") || ev.target.closest("#reelArea")) return;
  if(fishState === "waiting") endFishing(false, "early");
  else if(fishState === "bite") beginHit();
});

document.getElementById("btnFishCancel").addEventListener("click", ()=>{
  if(fishAnim) cancelAnimationFrame(fishAnim);
  fishState = "idle";
  reelDragging = false;
  document.getElementById("reelArea").classList.remove("show");
  document.getElementById("screen-fish").classList.remove("reeling");
  showScreen("screen-map");
});
document.getElementById("btnFishBack").addEventListener("click", ()=> showScreen("screen-map"));
document.getElementById("btnFishRetry").addEventListener("click", startFishing);

/* ============ フェーズ3: 宝探しミニゲーム ============ */
const peekCanvas = document.getElementById("peekCanvas");
const peekCtx = peekCanvas.getContext("2d");

function drawPeekScene(){
  const w = peekCanvas.width, h = peekCanvas.height;
  peekCtx.clearRect(0,0,w,h);
  const grad = peekCtx.createRadialGradient(w/2,h/2,20,w/2,h/2,w/2);
  grad.addColorStop(0,"#2f8fc4"); grad.addColorStop(1,"#0f4c75");
  peekCtx.fillStyle = grad; peekCtx.fillRect(0,0,w,h);
  peekCtx.fillStyle = "rgba(228,211,168,.5)";
  for(let i=0;i<10;i++){
    const x = Math.random()*w, y = Math.random()*h;
    peekCtx.beginPath(); peekCtx.ellipse(x,y,10,5,Math.random()*Math.PI,0,Math.PI*2); peekCtx.fill();
  }
}

function startPeek(){
  drawPeekScene();
  document.getElementById("peekResultActions").style.display = "none";
  document.getElementById("btnPeekCancel").style.display = "inline-block";
  const msgEl = document.getElementById("peekMsg");
  msgEl.textContent = I18N[state.lang].peekInstruction;
  const wrap = document.getElementById("peekWrap");
  wrap.querySelectorAll(".glow-spot").forEach(e=> e.remove());
  // 光るポイントは5か所(オーナー指示で3→5)。数を増やしたぶん、
  // 重ならない最小の間隔を22%→17%にゆるめ、置き直しの試行回数も増やしてある
  const used = [];
  const PEEK_SPOTS = 5;
  for(let i=0;i<PEEK_SPOTS;i++){
    let x,y,ok;
    let tries = 0;
    do{
      x = 12 + Math.random()*76; y = 12 + Math.random()*76; ok = true;
      for(const u of used){ if(Math.hypot(u.x-x, u.y-y) < 17) ok = false; }
      tries++;
    } while(!ok && tries < 80);
    used.push({x,y});
    const btn = document.createElement("button");
    btn.className = "glow-spot";
    btn.style.left = x + "%"; btn.style.top = y + "%";
    btn.addEventListener("click", handlePeekTap);
    wrap.appendChild(btn);
  }
}

/* カゴの中身を見せる演出。魚の playCatchReveal() と同じ役割。
   従来は「◯◯ ゲット！」の文字だけで、貝やエビの姿が一度も見えないままだった。
   水底から獲物がゆっくり浮かび上がり、あぶくときらきらを伴って中央で見得を切る。 */
const TREASURE_RARITY = { sazae:1, ebi:2, awabi:3, ise:4 };

function playPeekReveal(key, onDone){
  const w = peekCanvas.width, h = peekCanvas.height;
  const rarity = TREASURE_RARITY[key] || 1;
  const duration = 1150, risePhase = 0.55;
  const startY = h*0.92, endY = h*0.46, centerX = w/2;
  const start = performance.now();

  // 背景の砂はフレームごとに動かないよう先に位置を決めておく
  const sand = [];
  for(let i=0;i<10;i++) sand.push({x:Math.random()*w, y:h*0.5+Math.random()*h*0.5, a:Math.random()*Math.PI});
  const bubbles = [];
  for(let i=0;i<8+rarity*3;i++){
    bubbles.push({x:centerX+(Math.random()-0.5)*95, r:2+Math.random()*4,
                  speed:0.5+Math.random()*0.7, delay:Math.random()*0.4});
  }
  const sparkles = [];
  const numSp = rarity + 2;
  for(let i=0;i<numSp;i++){
    sparkles.push({angle:(i/numSp)*Math.PI*2 + Math.random()*0.5,
                   r:40+Math.random()*20, delay:Math.random()*0.25});
  }
  if(RARE_TREASURES.includes(key)) goldFlash();   // アワビ・イセエビは当たり枠

  function frame(now){
    const t = Math.min(1, (now-start)/duration);

    const grad = peekCtx.createRadialGradient(w/2,h/2,20,w/2,h/2,w/2);
    grad.addColorStop(0,"#2f8fc4"); grad.addColorStop(1,"#0f4c75");
    peekCtx.fillStyle = grad; peekCtx.fillRect(0,0,w,h);
    peekCtx.fillStyle = "rgba(228,211,168,.5)";
    sand.forEach(sd=>{
      peekCtx.beginPath(); peekCtx.ellipse(sd.x,sd.y,10,5,sd.a,0,Math.PI*2); peekCtx.fill();
    });

    bubbles.forEach(b=>{
      const dt = Math.max(0, t-b.delay);
      if(dt<=0) return;
      const by = startY - dt*h*b.speed*1.6;
      if(by < -10) return;
      peekCtx.strokeStyle = "rgba(255,255,255," + Math.max(0,.5-dt*0.4) + ")";
      peekCtx.lineWidth = 1.5;
      peekCtx.beginPath(); peekCtx.arc(b.x, by, b.r, 0, Math.PI*2); peekCtx.stroke();
    });

    let y, scale;
    if(t < risePhase){
      const t2 = t/risePhase;
      const e = 1 - Math.pow(1-t2, 3);      // 最後にゆっくり止まる
      y = startY + (endY-startY)*e;
      scale = 0.5 + 0.85*e;
    } else {
      const t3 = (t-risePhase)/(1-risePhase);
      y = endY - Math.sin(t3*Math.PI)*5;
      scale = 1.35 + Math.sin(t3*Math.PI*2)*0.04;
    }

    if(t >= risePhase){
      const t3 = (t-risePhase)/(1-risePhase);
      sparkles.forEach(sp=>{
        const dt = Math.max(0, t3-sp.delay);
        if(dt<=0) return;
        const a = Math.min(1, dt*3) * (1-dt);
        const sx = centerX + Math.cos(sp.angle)*sp.r*(0.7+dt*0.5);
        const sy = y + Math.sin(sp.angle)*sp.r*(0.7+dt*0.5);
        peekCtx.strokeStyle = "rgba(255,255,255," + Math.max(0,a) + ")";
        peekCtx.lineWidth = 2;
        peekCtx.beginPath();
        peekCtx.moveTo(sx-5,sy); peekCtx.lineTo(sx+5,sy);
        peekCtx.moveTo(sx,sy-5); peekCtx.lineTo(sx,sy+5);
        peekCtx.stroke();
      });
    }

    const size = 100*scale;
    peekCtx.save();
    peekCtx.translate(centerX, y);
    peekCtx.translate(-size/2, -size/2);
    drawSpeciesGraphic(peekCtx, size, size, key, false);
    peekCtx.restore();

    if(t < 1) requestAnimationFrame(frame);
    else if(onDone) onDone();
  }
  requestAnimationFrame(frame);
}

function handlePeekTap(){
  document.getElementById("peekWrap").querySelectorAll(".glow-spot").forEach(e=> e.remove());
  document.getElementById("btnPeekCancel").style.display = "none";
  const key = weightedPick(TREASURE_TABLES[state.kagoType] || TREASURE_TABLES.ebi);
  state.collected[key] = (state.collected[key] || 0) + 1;
  const dict = I18N[state.lang];
  // 獲物の姿を見せてから結果の文字とボタンを出す(金色フラッシュは演出側で出す)
  playPeekReveal(key, ()=>{
    document.getElementById("peekMsg").textContent =
      dict.gotItemTemplate.replace("{name}", FISH_NAMES[key][state.lang]);
    document.getElementById("peekResultActions").style.display = "flex";
  });
}

document.getElementById("btnPeekCancel").addEventListener("click", ()=> showScreen("screen-map"));
document.getElementById("btnPeekBack").addEventListener("click", ()=> showScreen("screen-map"));
document.getElementById("btnPeekRetry").addEventListener("click", startPeek);

drawFlagCanvases();
updateVoiceButtonVisibility();
applyI18n();
initCharScreen();   // 言語選択画面をなくし、日本語のキャラメイクから始まるため
</script>
